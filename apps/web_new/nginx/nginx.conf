worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  # Stock mime.types has no webmanifest entry (it would be octet-stream).
  types {
    application/manifest+json webmanifest;
  }

  default_type application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;

  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hashed bundles. A missing file is a real 404, never the SPA shell:
    # the community proxy sends /assets/* here first and retries the old
    # app on a 404 (both apps build into /assets/), so an index.html
    # fallback would answer every old-app bundle with HTML (PIDASH-2).
    location /assets/ {
      root   /usr/share/nginx/html;
      try_files $uri =404;
    }

    # Public directories (apps/web_new/public/): the proxy routes them here
    # first with the same 404 retry of the old app, so a missing file must
    # 404 too. Keep the list in step with public/ (self-host checks).
    location ~ ^/(empty-state|illustrations|logos)/ {
      root   /usr/share/nginx/html;
      try_files $uri =404;
    }

    # Single-page app: missing paths fall back to the shell. Community
    # builds never run the marketing prerender, so the fallback is the
    # plain Vite shell (cloud images serve their own prerendered file).
    location / {
      root   /usr/share/nginx/html;
      index  index.html;
      try_files $uri $uri/ /index.html;
    }
  }
}
