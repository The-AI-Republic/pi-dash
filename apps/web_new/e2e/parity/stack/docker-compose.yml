# Seeded parity stack (NEWFRONT-19).
#
# Own scratch backend for parity runs: Django API, Postgres, Redis,
# RabbitMQ, MinIO object storage, and the realtime apps/live service. Every name, port, and
# volume carries the parity19 prefix so runs never share a database with
# dev work or with each other. Ports are overridable through the
# PARITY_* environment variables; the defaults below are the contract
# the Playwright config and the runbook assume.
# Project (and therefore volume/network) isolation for parallel local runs:
# set PARITY_PROJECT=parity19s4 (say) to get a fully private stack on the
# same daemon. Unset keeps the stock parity19 names, so CI and the runbook
# are unchanged. (Container names take PARITY_CONTAINER_PREFIX likewise.)
name: ${PARITY_PROJECT:-parity19}

services:
  pg:
    image: postgres:15.7-alpine
    container_name: ${PARITY_CONTAINER_PREFIX:-parity19}-pg
    command: postgres -c 'max_connections=1000'
    environment:
      POSTGRES_USER: parity19
      POSTGRES_PASSWORD: parity19
      POSTGRES_DB: pidash
      PGDATA: /var/lib/postgresql/data
    volumes:
      - parity19_pgdata:/var/lib/postgresql/data
    ports:
      - "${PARITY_PG_PORT:-15419}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parity19 -d pidash"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ${PARITY_CONTAINER_PREFIX:-parity19}-redis
    ports:
      - "${PARITY_REDIS_PORT:-16319}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mq:
    image: rabbitmq:3-management-alpine
    container_name: ${PARITY_CONTAINER_PREFIX:-parity19}-mq
    environment:
      RABBITMQ_DEFAULT_USER: parity19
      RABBITMQ_DEFAULT_PASS: parity19
      RABBITMQ_DEFAULT_VHOST: pidash

  minio:
    image: minio/minio
    container_name: ${PARITY_CONTAINER_PREFIX:-parity19}-minio
    # Object storage for asset uploads (NEWFRONT-143): without it every
    # presigned upload 500s (no bucket configured). Mirrors the dev minio
    # setup; the bucket is created idempotently at boot. No healthcheck:
    # the API only signs URLs (never contacts minio), and browsers upload
    # minutes after boot, so start ordering is enough.
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/parity19-assets &&
      minio server /export --console-address ':9091' &
      sleep 5 &&
      mc alias set myminio http://localhost:9000 parity19minio parity19minio-scratch-secret &&
      mc mb myminio/parity19-assets -p || true
      && tail -f /dev/null
      "
    environment:
      MINIO_ROOT_USER: parity19minio
      MINIO_ROOT_PASSWORD: parity19minio-scratch-secret
    volumes:
      - parity19_miniodata:/export
    ports:
      - "${PARITY_MINIO_PORT:-19019}:9000"

  api:
    build:
      context: ../../../../../apps/api
      dockerfile: Dockerfile.dev
    image: parity19-api:local
    container_name: ${PARITY_CONTAINER_PREFIX:-parity19}-api
    # The stock dev entrypoint registers instances and buckets; parity runs
    # need only migrations plus the server, so the command replaces it.
    command:
      [
        "bash",
        "-c",
        "python manage.py migrate --no-input && exec uvicorn pi_dash.asgi:application --host 0.0.0.0 --port 8000",
      ]
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./parity_scratch_settings.py:/code/parity_scratch_settings.py:ro
    environment:
      DJANGO_SETTINGS_MODULE: parity_scratch_settings
      # Object storage (NEWFRONT-143): the asset endpoints sign presigned
      # URLs against this bucket; unset means every upload 500s.
      USE_MINIO: "1"
      AWS_ACCESS_KEY_ID: parity19minio
      AWS_SECRET_ACCESS_KEY: parity19minio-scratch-secret
      AWS_S3_BUCKET_NAME: parity19-assets
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT_URL: http://minio:9000
      MINIO_ENDPOINT_URL: http://minio:9000
      SECRET_KEY: parity19-fixed-local-secret-not-used-outside-scratch
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://parity19:parity19@pg:5432/pidash
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: mq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: parity19
      RABBITMQ_PASSWORD: parity19
      RABBITMQ_VHOST: pidash
      API_KEY_RATE_LIMIT: 100000/minute
      ENABLE_MAGIC_LINK_LOGIN: "1"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      WEB_URL: http://localhost:${PARITY_ORACLE_PORT:-13000}
      APP_BASE_URL: http://localhost:${PARITY_ORACLE_PORT:-13000}
      SPACE_BASE_URL: http://localhost:${PARITY_ORACLE_PORT:-13000}
      # BYOK key storage (NEWFRONT-187): Fernet with a fixed scratch-only
      # key, like SECRET_KEY above. Without it the default KMS backend is
      # unconfigured and every provider/speech-key save 503s, so assistant
      # oracles could never configure the key the chat needs.
      ASSISTANT_CRYPTO_BACKEND: fernet
      ASSISTANT_ENCRYPTION_KEY: aBpRyG1sxQfr1J0PQpxBXUgw79E4lXDzKu_bA1ZTmGM=
    ports:
      - "${PARITY_API_PORT:-18019}:8000"
    healthcheck:
      test:
        ["CMD-SHELL", 'python -c "import socket; socket.create_connection((''localhost'', 8000), timeout=5).close()"']
      interval: 10s
      timeout: 5s
      retries: 30

  oracle:
    build:
      context: ../../../../..
      dockerfile: apps/web_new/e2e/parity/stack/Dockerfile.oracle
    image: parity19-oracle:local
    container_name: ${PARITY_CONTAINER_PREFIX:-parity19}-oracle
    # Empty base keeps API calls same-origin; the proxy routes them to Django.
    environment:
      VITE_API_BASE_URL: ""
    # Listen on all interfaces so the proxy container can reach the server.
    command: ["pnpm", "--filter=web", "dev", "--host", "0.0.0.0", "--port", "3000"]
    depends_on:
      - api

  # Background task worker (NEWFRONT-115). The API queues mention
  # extraction, mention links and notifications as celery tasks; without a
  # consumer those rows never materialize, so mention/notification oracle
  # scenarios cannot observe the fan-out. Same image and environment as the
  # API, default queue only — no beat, no extra surface.
  worker:
    build:
      context: ../../../../../apps/api
      dockerfile: Dockerfile.dev
    image: parity19-api:local
    # Slotted like every other service (NEWFRONT-187): the hardcoded name
    # collided across PARITY_PROJECT stacks, so only the first stack ever
    # got a worker and assistant turns in every other slot never ran.
    container_name: ${PARITY_CONTAINER_PREFIX:-parity19}-worker
    command:
      [
        "bash",
        "-c",
        "python manage.py migrate --no-input > /dev/null 2>&1; exec celery -A pi_dash worker --loglevel=warning --concurrency=1",
      ]
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      mq:
        condition: service_started
      api:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: pi_dash.settings.local
      SECRET_KEY: parity19-fixed-local-secret-not-used-outside-scratch
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://parity19:parity19@pg:5432/pidash
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: mq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: parity19
      RABBITMQ_PASSWORD: parity19
      RABBITMQ_VHOST: pidash
      API_KEY_RATE_LIMIT: 100000/minute
      ENABLE_MAGIC_LINK_LOGIN: "1"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      WEB_URL: http://localhost:${PARITY_ORACLE_PORT:-13000}
      APP_BASE_URL: http://localhost:${PARITY_ORACLE_PORT:-13000}
      SPACE_BASE_URL: http://localhost:${PARITY_ORACLE_PORT:-13000}
      # Same Fernet key as api (NEWFRONT-187): the turn worker decrypts
      # stored provider keys at run time.
      ASSISTANT_CRYPTO_BACKEND: fernet
      ASSISTANT_ENCRYPTION_KEY: aBpRyG1sxQfr1J0PQpxBXUgw79E4lXDzKu_bA1ZTmGM=

  proxy:
    image: caddy:2-alpine
    container_name: ${PARITY_CONTAINER_PREFIX:-parity19}-proxy
    depends_on:
      - api
      - oracle
      - minio
    # Forwarded so the Caddyfile's {$ORACLE_UPSTREAM} override (native
    # frontend) reaches the server; unset keeps the stock oracle:3000.
    environment:
      ORACLE_UPSTREAM: ${ORACLE_UPSTREAM:-oracle:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${PARITY_ORACLE_PORT:-13000}:80"

  live:
    build:
      context: ../../../../..
      dockerfile: apps/live/Dockerfile.live
    image: parity19-live:local
    container_name: ${PARITY_CONTAINER_PREFIX:-parity19}-live
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "3001"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${PARITY_LIVE_PORT:-13001}:3001"
    profiles: ["full"]

volumes:
  parity19_pgdata:
  parity19_miniodata:
