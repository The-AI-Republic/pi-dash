# nginx for the cloud-edition parity oracle (NEWFRONT-436). Full server
# config, read in place of the OSS one (which the cloud image does not
# use): the cloud bundle prerenders its marketing surface (/, /home,
# /docs, /pricing, /downloads land as index.html files), so directory
# URLs must serve their prerendered page directly. The OSS config probes
# the directory itself first and answers a 301 whose absolute Location
# names the oracle's internal host:port — unreachable through the proxy.
# Trying the prerendered file before the bare path serves /home with no
# redirect, exactly how the deployed cloud frontend serves it; anything
# with no prerendered page and no static file falls back to the SPA
# shell, which renders client-side routes like /login.
worker_processes 1;

events {
  worker_connections 256;
}

http {
  include mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 3000;
    root /usr/share/nginx/html;

    location / {
      try_files $uri/index.html $uri /__spa-fallback.html;
    }
  }
}
