# OSS self-host: the active system only (NEWPIDASH-382).
#
# Services: web_new (React SPA), api + worker (Rust image and entrypoints),
# migrator, live, pi-dash-db, pi-dash-redis, pi-dash-minio and proxy (Caddy).
# There is no web, admin, space, beat-worker or RabbitMQ service: the old
# frontends and the Django/Celery stack are frozen and never run here.
#
# Migrator interim (NEWPIDASH-380): the migrator below runs Django
# `python manage.py migrate` from the apps/api image. It is the only Python
# container, and it exits after migrating. TODO(NEWPIDASH-380): swap it for
# the native `pidash-api migrate up` image and entrypoint, and drop the
# apps/api build. Until then, api and worker keep `wait_for_migrations`
# (NEWPIDASH-378 swaps it for the fail-fast check); nothing else polls.
#
# Migration order: api and worker start only after the migrator completes
# successfully, and setup.sh (plus the documented upgrade command) runs
# `docker compose run --rm migrator` first and stops with a nonzero exit
# when it fails.

x-rust-cutover-flags: &rust-cutover-flags
  # Rust-only edge interim (NEWPIDASH-381): explicit 1s plus a dead upstream.
  # Redundant under 381's defaults but harmless, so a rollback needs no
  # compose change. The upstream is the discard port on loopback: nothing
  # listens there, and it is never contacted while every flag below is 1.
  PIDASH_RUST_WEB: "1"
  PIDASH_RUST_APP: "1"
  PIDASH_RUST_ASSISTANT: "1"
  PIDASH_RUST_LOOP: "1"
  PIDASH_RUST_PROMPTING: "1"
  PIDASH_RUST_SPACE: "1"
  PIDASH_RUST_LICENSE: "1"
  PIDASH_RUST_RUNNER_WEB: "1"
  PIDASH_RUST_API_V1: "1"
  PIDASH_RUST_RUNNER: "1"
  PIDASH_RUST_AUTH: "1"
  PIDASH_DJANGO_UPSTREAM: http://127.0.0.1:9

services:
  web_new:
    container_name: web_new
    build:
      context: .
      dockerfile: ./apps/web_new/Dockerfile.web-new
      args:
        DOCKER_BUILDKIT: 1
    restart: always

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./rust-api/Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./rust-api/.env
    environment:
      <<: *rust-cutover-flags
      PORT: "8000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      pi-dash-db:
        condition: service_healthy
      pi-dash-redis:
        condition: service_healthy
    expose:
      - "8000"
    # No curl/wget/Python in the Rust image (rust-api/Dockerfile.api), so
    # the probe is bash's /dev/tcp against /healthz (serve answers
    # {"status":"ok",...} there).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -c 64 <&3 | grep -q \" 200 \"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    container_name: bgworker
    build:
      context: .
      dockerfile: ./rust-api/Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./rust-api/.env
    environment:
      <<: *rust-cutover-flags
    # The scheduler runs inside the worker; there is no beat service.
    depends_on:
      migrator:
        condition: service_completed_successfully
      pi-dash-db:
        condition: service_healthy
      pi-dash-redis:
        condition: service_healthy

  migrator:
    container_name: pi-dash-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      pi-dash-db:
        condition: service_healthy
      pi-dash-redis:
        condition: service_started
    restart: "no"

  live:
    container_name: pi-dash-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./rust-api/.env
    environment:
      # Live defaults to PORT 3000 in code (apps/live/src/env.ts); the 3100
      # in apps/live/.env.example is host-dev only. Caddy proxies to
      # live:3000, so the compose value must be 3000.
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
      pi-dash-redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/live/health/",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  pi-dash-db:
    container_name: pi-dash-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pi-dash-redis:
    container_name: pi-dash-redis
    image: valkey/valkey:7.2.11-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pi-dash-minio:
    container_name: pi-dash-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      # Caddy substitutes {$SITE_ADDRESS} into the site block address.
      # Without it, the line collapses to an empty unkeyed block which
      # Caddy 2.10's parser rejects with "server block without any key
      # is global configuration, and if used, it must be first".
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CERT_EMAIL: ${CERT_EMAIL:-}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
    depends_on:
      - web_new
      - api
      - live
      - pi-dash-minio

volumes:
  pgdata:
  redisdata:
  uploads:
