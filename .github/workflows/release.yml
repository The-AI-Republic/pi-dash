#
# CI that:
#
# * builds a release candidate with cargo-dist (archives, installers, hashes)
#   from a commit that is already on main
# * finishes every transformation (pinned install wrappers, release notes)
#   so the candidate is byte-for-byte what will be published
# * scans and smoke-tests that final candidate
# * hands it to the protected publisher, which creates the release tag and
#   publishes exactly the scanned files
#
# Publication gate (.github/publication-gate/README.md): nothing here runs
# on a tag push. A release starts from workflow_dispatch with the tag to
# create and the commit to build; only the `publish` job, in the protected
# `release-publisher` environment, can create the tag or the GitHub Release.
# Creating a release tag by any other means publishes nothing.

name: Release
permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Runner release tag to create, shaped pidash-vX.Y.Z[-pre]"
        required: true
        type: string
      sha:
        description: "Full commit SHA on main to build and release"
        required: true
        type: string

jobs:
  # Check the request before anything is built: the tag is a runner release
  # tag that does not exist yet, and the commit is already on main (reviewed
  # and merged), so the candidate is built from a staged, gated ref.
  stage:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: "ubuntu-22.04"
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^pidash-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must look like pidash-vX.Y.Z[-pre], got '$TAG'"; exit 1
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA"; exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main; only merged commits can be released"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; release tags are never moved"; exit 1
          fi
          version="$(git show "$SHA:runner/Cargo.toml" | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n1)"
          if [ "pidash-v$version" != "$TAG" ]; then
            echo "::error::runner/Cargo.toml at $SHA is version $version, which does not match $TAG"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # Run 'cargo dist plan' (or host) to determine what tasks we need to do
  plan:
    needs:
      - stage
    # Pull requests only plan; a dispatch plans the staged candidate.
    if: ${{ always() && (github.event_name == 'pull_request' || needs.stage.result == 'success') }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ needs.stage.outputs.tag }}
      sha: ${{ needs.stage.outputs.sha }}
      tag-flag: ${{ needs.stage.outputs.tag && format('--tag={0}', needs.stage.outputs.tag) || '' }}
      publishing: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.stage.outputs.sha || github.sha }}
      - name: Install cargo-dist
        # Hand-patched (cargo-dist generates this file; "ci" is in allow-dirty).
        #
        # cargo-dist's own installer scripts fetch the binary from
        # axodotdev.artifacts.axodotdev.host, which returns HTTP 429 to
        # everyone -- it rate-limited a release run to death on 2026-09-07 and
        # kept doing so on retry. That host is a single vendor CDN sitting in
        # the critical path of every release. The identical binaries are
        # published as GitHub release assets, so fetch those directly and skip
        # the installer scripts entirely.
        #
        # Checksums are still verified, as the installer scripts do.
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)    target=x86_64-unknown-linux-gnu;  ext=tar.xz ;;
            Linux-ARM64)  target=aarch64-unknown-linux-gnu; ext=tar.xz ;;
            macOS-X64)    target=x86_64-apple-darwin;       ext=tar.xz ;;
            macOS-ARM64)  target=aarch64-apple-darwin;      ext=tar.xz ;;
            Windows-X64)  target=x86_64-pc-windows-msvc;    ext=zip    ;;
            *) echo "::error::no cargo-dist build for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac

          base="https://github.com/axodotdev/cargo-dist/releases/download/v0.22.1"
          archive="cargo-dist-${target}.${ext}"
          tmp="$(mktemp -d)"

          curl --proto '=https' --tlsv1.2 -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${tmp}/${archive}.sha256" "${base}/${archive}.sha256"

          # The .sha256 asset is `<digest> *<filename>`, so take field one.
          expected="$(awk '{print $1}' < "${tmp}/${archive}.sha256")"
          if command -v sha256sum >/dev/null; then
            actual="$(sha256sum "${tmp}/${archive}" | cut -d' ' -f1)"
          else
            actual="$(shasum -a 256 "${tmp}/${archive}" | cut -d' ' -f1)"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::checksum mismatch for ${archive}: expected ${expected}, got ${actual}"
            exit 1
          fi

          # `shell: bash` on a Windows runner is Git Bash, whose tar is GNU tar
          # and cannot read a zip -- it shadows the bsdtar Windows ships. Hand
          # the zip to PowerShell instead, converting the MSYS paths first.
          if [ "${ext}" = "zip" ]; then
            powershell -NoProfile -Command \
              "Expand-Archive -Path '$(cygpath -w "${tmp}/${archive}")' -DestinationPath '$(cygpath -w "${tmp}")' -Force"
          else
            tar -xf "${tmp}/${archive}" -C "${tmp}"
          fi

          # Layouts differ: the tarballs unpack into cargo-dist-<target>/, the
          # zip puts cargo-dist.exe at the archive root. Search for either.
          mkdir -p "${HOME}/.cargo/bin"
          binary="$(find "${tmp}" -maxdepth 2 -type f \( -name 'cargo-dist' -o -name 'cargo-dist.exe' \) | head -n1)"
          if [ -z "${binary}" ]; then
            echo "::error::cargo-dist binary not found in ${archive}"
            find "${tmp}" -maxdepth 2
            exit 1
          fi
          install -m 0755 "${binary}" "${HOME}/.cargo/bin/"
          cargo-dist --version
      - name: Cache cargo-dist
        uses: actions/upload-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/cargo-dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          cargo dist ${{ (needs.stage.outputs.tag && format('host --steps=create --tag={0}', needs.stage.outputs.tag)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "cargo dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by cargo-dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to cargo dist
      # - install-dist: expression to run to install cargo-dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      - name: Install cargo-dist
        # Hand-patched (cargo-dist generates this file; "ci" is in allow-dirty).
        #
        # cargo-dist's own installer scripts fetch the binary from
        # axodotdev.artifacts.axodotdev.host, which returns HTTP 429 to
        # everyone -- it rate-limited a release run to death on 2026-09-07 and
        # kept doing so on retry. That host is a single vendor CDN sitting in
        # the critical path of every release. The identical binaries are
        # published as GitHub release assets, so fetch those directly and skip
        # the installer scripts entirely.
        #
        # Checksums are still verified, as the installer scripts do.
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)    target=x86_64-unknown-linux-gnu;  ext=tar.xz ;;
            Linux-ARM64)  target=aarch64-unknown-linux-gnu; ext=tar.xz ;;
            macOS-X64)    target=x86_64-apple-darwin;       ext=tar.xz ;;
            macOS-ARM64)  target=aarch64-apple-darwin;      ext=tar.xz ;;
            Windows-X64)  target=x86_64-pc-windows-msvc;    ext=zip    ;;
            *) echo "::error::no cargo-dist build for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac

          base="https://github.com/axodotdev/cargo-dist/releases/download/v0.22.1"
          archive="cargo-dist-${target}.${ext}"
          tmp="$(mktemp -d)"

          curl --proto '=https' --tlsv1.2 -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${tmp}/${archive}.sha256" "${base}/${archive}.sha256"

          # The .sha256 asset is `<digest> *<filename>`, so take field one.
          expected="$(awk '{print $1}' < "${tmp}/${archive}.sha256")"
          if command -v sha256sum >/dev/null; then
            actual="$(sha256sum "${tmp}/${archive}" | cut -d' ' -f1)"
          else
            actual="$(shasum -a 256 "${tmp}/${archive}" | cut -d' ' -f1)"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::checksum mismatch for ${archive}: expected ${expected}, got ${actual}"
            exit 1
          fi

          # `shell: bash` on a Windows runner is Git Bash, whose tar is GNU tar
          # and cannot read a zip -- it shadows the bsdtar Windows ships. Hand
          # the zip to PowerShell instead, converting the MSYS paths first.
          if [ "${ext}" = "zip" ]; then
            powershell -NoProfile -Command \
              "Expand-Archive -Path '$(cygpath -w "${tmp}/${archive}")' -DestinationPath '$(cygpath -w "${tmp}")' -Force"
          else
            tar -xf "${tmp}/${archive}" -C "${tmp}"
          fi

          # Layouts differ: the tarballs unpack into cargo-dist-<target>/, the
          # zip puts cargo-dist.exe at the archive root. Search for either.
          mkdir -p "${HOME}/.cargo/bin"
          binary="$(find "${tmp}" -maxdepth 2 -type f \( -name 'cargo-dist' -o -name 'cargo-dist.exe' \) | head -n1)"
          if [ -z "${binary}" ]; then
            echo "::error::cargo-dist binary not found in ${archive}"
            find "${tmp}" -maxdepth 2
            exit 1
          fi
          install -m 0755 "${binary}" "${HOME}/.cargo/bin/"
          cargo-dist --version
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      # Hand-added (cargo-dist doesn't know about this): stage the built-in
      # engine (the pinned OpenAI Codex release in runner/ENGINE_VERSION,
      # SHA-256-checked against the upstream release metadata and renamed
      # pidash-agent-engine) so `include` in dist-workspace.toml puts
      # engine/<version>/ into this target's archive, and runner/wix/main.wxs
      # can put it into the MSI. See design
      # .ai_design/built_engine_as_runner §4.5.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage built-in engine
        shell: bash
        env:
          TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$TARGETS"
          # One engine per archive: stage_engine.py replaces the staging
          # directory, so a job building several targets would ship the last
          # target's engine in all of them. Fail instead of doing that.
          if [ "${#targets[@]}" -ne 1 ]; then
            echo "::error::expected one target per build-local-artifacts job, got: $TARGETS"
            exit 1
          fi
          python runner/scripts/stage_engine.py --target "${targets[0]}"
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          cargo dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "cargo dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      - name: Install cached cargo-dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/cargo-dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          cargo dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "cargo dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Finish the candidate: every byte that will be published is produced
  # here, before the scan. Nothing in this job can publish anything.
  candidate:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only when publishing, and only if local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    runs-on: "ubuntu-22.04"
    outputs:
      manifest-digest: ${{ steps.record.outputs.digest }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: candidate/files
          merge-multiple: true
      - name: Remove build-only manifests
        run: |
          # The granular manifests and the plan are build bookkeeping, not
          # release assets.
          rm -f candidate/files/*-dist-manifest.json candidate/files/plan-dist-manifest.json candidate/files/dist-manifest.json
      # The install.sh / install.ps1 wrappers ship alongside the cargo-dist
      # artifacts so the documented one-liners
      # (…/releases/latest/download/install.sh and …/install.ps1) resolve.
      # Each wrapper drops the binary via the matching cargo-dist installer
      # (pidash-installer.sh / pidash-installer.ps1) and immediately launches
      # `pidash auth login`.
      #
      # The wrappers carry `latest` in their download URLs, so pin them to
      # this tag (including install.ps1's MSI fallback link, which must name
      # the same release's MSI). The grep fails the job if any pidash-* asset
      # URL is still on `latest`, so a wrapper edit that stops matching can't
      # silently break pinning.
      - name: Pin install wrappers to this release
        shell: bash
        run: |
          set -euo pipefail
          cp runner/install.sh runner/install.ps1 candidate/files/
          sed -i "s|/releases/latest/download/pidash-installer.sh|/releases/download/${TAG}/pidash-installer.sh|" candidate/files/install.sh
          sed -i "s|/releases/latest/download/pidash-installer.ps1|/releases/download/${TAG}/pidash-installer.ps1|" candidate/files/install.ps1
          sed -i "s|/releases/latest/download/pidash-x86_64-pc-windows-msvc.msi|/releases/download/${TAG}/pidash-x86_64-pc-windows-msvc.msi|" candidate/files/install.ps1
          if grep -n "releases/latest/download/pidash-" candidate/files/install.sh candidate/files/install.ps1; then
            echo "::error::install wrapper still references a 'latest' pidash-* asset (lines above); update the sed rewrites"
            exit 1
          fi
      - name: Write the release text
        env:
          PRERELEASE: ${{ fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(needs.plan.outputs.val).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(needs.plan.outputs.val).announcement_github_body }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/release
          printf '%s\n' "$ANNOUNCEMENT_TITLE" > candidate/release/title.txt
          printf '%s\n' "$ANNOUNCEMENT_BODY" > candidate/release/notes.md
          printf '%s\n' "$PRERELEASE" > candidate/release/prerelease.txt
      - id: record
        name: Record the candidate
        shell: bash
        run: |
          set -euo pipefail
          digest="$(python3 .github/publication-gate/gate.py build-manifest candidate --tag "$TAG" --sha "$SHA")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: candidate
          if-no-files-found: error

  # Scan and test the final candidate: the published files, the release text
  # and the source tree of the commit the tag will point at.
  scan:
    needs:
      - plan
      - candidate
    environment: publication-scan
    runs-on: "ubuntu-22.04"
    outputs:
      manifest-digest: ${{ steps.approve.outputs.digest }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      CANDIDATE_DIGEST: ${{ needs.candidate.outputs.manifest-digest }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
      - name: Candidate is intact
        run: python3 source/.github/publication-gate/gate.py verify-manifest candidate --expect-digest "$CANDIDATE_DIGEST"
      # The denylist is visible only to the two steps that need it.
      - name: Scanner rejects a planted leak
        env:
          PUBLICATION_DENYLIST: ${{ secrets.PUBLICATION_DENYLIST }}
        run: python3 source/.github/publication-gate/gate.py self-test --denylist-env PUBLICATION_DENYLIST --require-denylist
      - name: Scan the candidate and its source tree
        env:
          PUBLICATION_DENYLIST: ${{ secrets.PUBLICATION_DENYLIST }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir tree
          git -C source archive "$SHA" | tar -x -C tree
          cd source
          python3 .github/publication-gate/gate.py scan --denylist-env PUBLICATION_DENYLIST --require-denylist ../candidate ../tree
      - name: Smoke-test the Linux archive
        shell: bash
        run: |
          set -euo pipefail
          archive="candidate/files/pidash-x86_64-unknown-linux-gnu.tar.xz"
          test -f "$archive" || { echo "::error::$archive is missing from the candidate"; exit 1; }
          mkdir smoke
          tar -xJf "$archive" -C smoke
          bin="$(find smoke -type f -name pidash -perm -u+x | head -n1)"
          test -n "$bin" || { echo "::error::no pidash binary in $archive"; exit 1; }
          out="$("$bin" --version)"
          echo "$out"
          case "$out" in
            *"${TAG#pidash-v}"*) ;;
            *) echo "::error::binary reports '$out', expected version ${TAG#pidash-v}"; exit 1 ;;
          esac
          ( cd candidate/files && sha256sum -c --ignore-missing --quiet *.sha256 ) || {
            echo "::error::a published checksum does not match its file"; exit 1; }
      - id: approve
        name: Approve this exact candidate
        run: |
          digest="$(python3 -c 'import json,sys; sys.path.insert(0,"source/.github/publication-gate"); import gate; print(gate.manifest_digest(json.load(open("candidate/publication-manifest.json"))))')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Approved candidate manifest $digest"

  # The protected publisher: the only job that holds publish credentials and
  # the only identity the tag ruleset lets create a release tag. It runs after
  # a reviewer approves the `release-publisher` environment, and publishes
  # only the files the scan approved.
  publish:
    needs:
      - plan
      - scan
    environment: release-publisher
    if: ${{ !cancelled() && needs.scan.result == 'success' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      APPROVED_DIGEST: ${{ needs.scan.outputs.manifest-digest }}
      PUBLISHER_APP_ID: ${{ vars.PUBLISHER_APP_ID }}
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
      - name: Publish only what was scanned
        run: python3 source/.github/publication-gate/gate.py verify-manifest candidate --expect-digest "$APPROVED_DIGEST"
      - id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
      - name: Tag ruleset is live
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 source/.github/publication-gate/gate.py check-live-ruleset --repo "$GITHUB_REPOSITORY" --app-id "$PUBLISHER_APP_ID"
      - name: Create the release tag and publish the candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag is created here, by the publisher, at the scanned commit.
          # No workflow starts on tag creation, so this does not publish twice.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          flags=()
          if [ "$(cat candidate/release/prerelease.txt)" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" \
            --title "$(cat candidate/release/title.txt)" \
            --notes-file candidate/release/notes.md \
            candidate/files/*
      # Publish the Cloud advisory source of truth only. Do not restart EC2,
      # redeploy the API, or mutate MIN_RUNNER_VERSION from a normal release.
      - name: Configure AWS credentials
        if: ${{ fromJson(needs.plan.outputs.val).announcement_is_prerelease == false }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Publish latest runner version to Cloud SSM
        if: ${{ fromJson(needs.plan.outputs.val).announcement_is_prerelease == false }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#pidash-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "::error::expected runner tag shaped pidash-vX.Y.Z, got '$TAG'"
            exit 1
          fi

          for target in test prod; do
            aws ssm put-parameter \
              --region "$AWS_REGION" \
              --name "/pidash/config/${target}/LATEST_RUNNER_VERSION" \
              --type String \
              --value "$VERSION" \
              --overwrite
            echo "Published LATEST_RUNNER_VERSION=$VERSION to /pidash/config/${target}/"
          done
