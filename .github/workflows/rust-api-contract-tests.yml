# Contract suites: pytest + httpx oracle tests under rust-api/contract-tests/.
# Each domain job boots the live Django backend (Postgres service) and runs
# the same suite that later runs against the Rust server through the proxy.
name: rust-api contract tests

on:
  workflow_dispatch:
  push:
    branches: [rust-dev]
    paths:
      - "rust-api/**"
      - "apps/api/**"
      - ".github/workflows/rust-api-contract-tests.yml"


permissions:
  contents: read

# Pull requests cancel their superseded run. Pushes to rust-dev do not: with
# merges landing every few minutes a cancelled-on-push run never finishes, so
# the branch would have no post-merge result. Same group without cancel means
# at most one run in progress and one pending (a newer push replaces the
# pending one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-edge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pidash_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pidash_contract
      WEB_URL: http://localhost
      APP_BASE_URL: http://localhost
      EMAIL_HOST: localhost
      API_KEY_RATE_LIMIT: 100000/minute
      DJANGO_SETTINGS_MODULE: pi_dash.settings.test
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install system deps for psycopg-c
        run: sudo apt-get update -y && sudo apt-get install -y libpq-dev

      - name: Install Django server and contract-test deps
        run: >-
          python -m pip install
          -r apps/api/requirements/base.txt
          -r rust-api/contract-tests/requirements.txt

      - name: Migrate contract database
        working-directory: apps/api
        run: python manage.py migrate --no-input

      - name: Start live Django server
        working-directory: apps/api
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/django-contract.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$BASE_URL/"; then
              echo "Django is up"; exit 0
            fi
            sleep 4
          done
          echo "Django did not start:"; tail -n 50 /tmp/django-contract.log; exit 1

      - name: Run web_edge contract suite
        working-directory: rust-api/contract-tests
        run: python -m pytest web_edge -v
  contract-tests:
    name: worker-plane oracle vs Django
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: pi_dash
          POSTGRES_PASSWORD: pi_dash
          POSTGRES_DB: pi_dash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi_dash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13.6-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pi_dash
          RABBITMQ_DEFAULT_PASS: pi_dash
          RABBITMQ_DEFAULT_VHOST: pi_dash
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    # No minio service container: Docker Hub no longer serves minio/minio,
    # and service containers cannot pass the required `server /data`
    # command. The "Start minio" step below runs quay.io/minio/minio
    # (MinIO's canonical registry) with the same invocation as
    # docker-compose.yml's pi-dash-minio service.
    env:
      DJANGO_SETTINGS_MODULE: pi_dash.settings.local
      POSTGRES_USER: pi_dash
      POSTGRES_PASSWORD: pi_dash
      POSTGRES_DB: pi_dash
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: pi_dash
      RABBITMQ_PASSWORD: pi_dash
      RABBITMQ_VHOST: pi_dash
      WEB_URL: http://localhost
      APP_BASE_URL: http://localhost
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "0"
      EMAIL_USE_SSL: "0"
      EMAIL_FROM: Pi Dash Contract <contract@example.com>
      HARD_DELETE_AFTER_DAYS: "0"
      UNUPLOADED_ASSET_DELETE_DAYS: "0"
      USE_MINIO: "1"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_STORAGE_BUCKET_NAME: pi-dash-contract
      AWS_S3_ENDPOINT_URL: http://localhost:4566
      BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://pi_dash:pi_dash@localhost:5432/pi_dash
      CELERY_BROKER_URL: amqp://pi_dash:pi_dash@localhost:5672/pi_dash
      CONTRACT_REDIS_URL: redis://localhost:6379/0
      CONTRACT_TASK_TIMEOUT: "60"
      # D-06 assistant task oracle (PIDASHCONV-254): BYOK config encryption
      # needs a backend. Fernet with a committed test-only key (ephemeral CI
      # database; never a real secret) — the other oracles never touch BYOK.
      ASSISTANT_CRYPTO_BACKEND: fernet
      ASSISTANT_ENCRYPTION_KEY: -k26Q_XWFtfq5jzJTSUY483-H3-wrdJ67w2kQgLDmlU=
      # PIDASHCONV-1248: the sweep honors a non-default hard limit — the
      # oracle pins both sides of the resulting 960s cutoff. Only the
      # assistant tasks read this key, and ancient-seeded turns stay stale
      # under 900, so the other oracles in this job are unaffected.
      ASSISTANT_TURN_HARD_LIMIT: "900"
      # D-08 event-tracking oracle (PIDASHCONV-1107): the Django worker
      # POSTs track_event captures to the harness PostHog sink
      # (POSTHOG_SINK_BASE default). Test-only key, ephemeral CI database.
      POSTHOG_API_KEY: contract-posthog-key
      POSTHOG_HOST: http://127.0.0.1:18098
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements/base.txt
            apps/api/requirements/test.txt
            rust-api/contract-tests/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          # pi_dash.settings.local imports debug_toolbar (requirements/local.txt)
          pip install "django-debug-toolbar==4.3.0"

      - name: Install contract-test dependencies
        working-directory: rust-api/contract-tests
        run: pip install -r requirements.txt

      - name: Migrate contract database
        working-directory: apps/api
        run: python manage.py migrate --no-input

      # S3 is LocalStack, not MinIO: quay.io now rejects anonymous pulls
      # ("unauthorized", verified 2026-09-26) and Docker Hub no longer
      # serves minio/minio. Only bucket-exists/create + delete_object are
      # exercised (the suite seeds exporters with an empty key).
      - name: Start S3 (LocalStack)
        run: |
          docker run -d --name contract-s3 -p 4566:4566 \
            -e SERVICES=s3 \
            localstack/localstack:4.5.0
          for i in $(seq 1 45); do
            curl -sf http://localhost:4566/_localstack/health && break
            sleep 2
          done

      - name: Create S3 bucket
        run: |
          pip install minio
          python - <<'EOF'
          import time
          from minio import Minio
          client = Minio("localhost:4566", access_key="minioadmin",
                         secret_key="minioadmin", secure=False)
          for _ in range(30):
              try:
                  if not client.bucket_exists("pi-dash-contract"):
                      client.make_bucket("pi-dash-contract")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("S3 never became ready")
          EOF

      - name: Start Django API
        working-directory: apps/api
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 \
            > /tmp/contract-api.log 2>&1 &
          # TCP probe: Django returns 404 on / with DEBUG on, so don't use -f.
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/8000) >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Start Celery worker
        working-directory: apps/api
        run: |
          # -E (worker_send_events): the ticker fan-out tests observe
          # task-received events, which are broadcast and never race the
          # worker's own queue consumption the way draining would.
          # -I (oracle includes, PIDASHCONV-1104): task modules the stock
          # worker never imports (PDASHOSS01-292), one per line in the
          # harness file (each task-port issue appends its own); without
          # them the oracle cannot execute the unregistered tasks.
          INCLUDES=$(grep -v '^[[:space:]]*#' ../../rust-api/contract-tests/_harness/oracle_worker_includes.txt | grep -v '^[[:space:]]*$' | paste -sd,)
          nohup celery -A pi_dash worker -E --pool=solo -I "$INCLUDES" --loglevel=info \
            > /tmp/contract-worker.log 2>&1 &

      - name: Start Celery beat
        working-directory: apps/api
        run: |
          nohup celery -A pi_dash beat --loglevel=info \
            > /tmp/contract-beat.log 2>&1 &

      # PIDASHCONV-1062: the turn-errors static tests assert on Django source
      # that exists on origin/main only. Fetch the pinned commit and check
      # it out as a worktree; retire after the next main-sync merges main
      # into rust-dev. PIDASHCONV-1566: re-pinned past 52df56b9e (#1430),
      # which replaced the classifier the statics assert on (matches
      # MAIN_PIN in assistant/test_turn_errors.py).
      - name: Provision origin/main worktree for drift static tests
        run: |
          git fetch origin 0a6fb8eca0f459802045f22e02af5748a6bdc768 --depth 1
          git worktree add --detach /tmp/pi-dash-main 0a6fb8eca0f459802045f22e02af5748a6bdc768
          echo "PIDASH_DJANGO_MAIN_DIR=/tmp/pi-dash-main/apps/api" >> "$GITHUB_ENV"

      - name: Run worker-plane oracle
        working-directory: rust-api/contract-tests
        # The job env exports DJANGO_SETTINGS_MODULE for the API steps and the
        # API requirements install pytest-django into the same interpreter, so
        # without this the django plugin tries to import pi_dash from this dir
        # and collection fails before any test runs. The oracle never touches
        # Django (wire format + DB diff + sinks only).
        # Replay suites (tasks_*/test_rust_replay*.py) need the Rust-owned
        # rust_job_queue table and the Rust worker, neither of which exists
        # in this Django-only job — they have their own *-rust jobs. Exclude
        # by glob so future replay suites are skipped here too.
        # The S3 stall oracle (tasks_cleanup/test_s3_stall.py) needs a worker
        # whose S3 endpoint is the test's black hole; this job's worker points
        # at live S3, so it has its own stall job (PIDASHCONV-1291).
        # The mongo write-error oracle
        # (tasks_cleanup/test_mongo_write_error.py) needs a worker booted
        # with MONGO_DB_URL/MONGO_DB_DATABASE; this job's worker has no
        # Mongo, so it has its own mongo job (PIDASHCONV-1290).
        # The S3 retry oracle (tasks_cleanup/test_s3_retry.py) needs a
        # worker whose S3 endpoint is the test's scripted stub; this job's
        # worker points at live S3, so it has its own s3retry job
        # (PIDASHCONV-1697).
        # PIDASHCONV-1566 (stage-8 drift hold): assistant/test_turn_errors_drift.py
        # asserts behavior that exists only on origin/main (52df56b9e); this
        # job serves Django from the frozen checkout, so the file stays out
        # of the selection until the next main-sync merges main into
        # rust-dev, then is added next to assistant/test_turn_errors.py.
        run: env -u DJANGO_SETTINGS_MODULE pytest -p no:django --ignore-glob='*/test_rust_replay*.py' --ignore-glob='*/test_s3_stall.py' --ignore-glob='*/test_mongo_write_error.py' --ignore-glob='*/test_s3_retry.py' tasks_mail tasks_webhooks tasks_cleanup tasks_ticker assistant/test_tasks_turn.py assistant/test_turn_errors.py assistant/test_update_issue_completion.py assistant/test_create_issue_transition.py assistant/test_dispatch_coding_run.py

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-service-logs
          path: /tmp/contract-*.log
