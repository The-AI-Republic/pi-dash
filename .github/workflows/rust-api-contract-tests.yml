name: Rust API contract tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "rust-dev"
    paths:
      - "rust-api/**"
      - ".github/workflows/rust-api-contract-tests.yml"
  push:
    branches:
      - "rust-dev"
    paths:
      - "rust-api/**"
      - ".github/workflows/rust-api-contract-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-tests:
    name: worker-plane oracle vs Django
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: pi_dash
          POSTGRES_PASSWORD: pi_dash
          POSTGRES_DB: pi_dash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi_dash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13.6-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pi_dash
          RABBITMQ_DEFAULT_PASS: pi_dash
          RABBITMQ_DEFAULT_VHOST: pi_dash
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        # No health check: the minio image ships no curl/shell probe tools.
        # Bucket creation below retries until the server answers.
    env:
      DJANGO_SETTINGS_MODULE: pi_dash.settings.local
      POSTGRES_USER: pi_dash
      POSTGRES_PASSWORD: pi_dash
      POSTGRES_DB: pi_dash
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: pi_dash
      RABBITMQ_PASSWORD: pi_dash
      RABBITMQ_VHOST: pi_dash
      WEB_URL: http://localhost
      APP_BASE_URL: http://localhost
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "0"
      EMAIL_USE_SSL: "0"
      EMAIL_FROM: Pi Dash Contract <contract@example.com>
      HARD_DELETE_AFTER_DAYS: "0"
      UNUPLOADED_ASSET_DELETE_DAYS: "0"
      USE_MINIO: "1"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_STORAGE_BUCKET_NAME: pi-dash-contract
      AWS_S3_ENDPOINT_URL: http://localhost:9000
      BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://pi_dash:pi_dash@localhost:5432/pi_dash
      CELERY_BROKER_URL: amqp://pi_dash:pi_dash@localhost:5672/pi_dash
      CONTRACT_TASK_TIMEOUT: "60"
      # Fixed key so HTTP suites can forge session rows (see
      # rust-api/contract-tests/_harness/http.py); must match
      # CONTRACT_SECRET_KEY below.
      SECRET_KEY: "contract-tests-fixed-secret"
      CONTRACT_SECRET_KEY: "contract-tests-fixed-secret"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements/base.txt
            apps/api/requirements/test.txt
            rust-api/contract-tests/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          # pi_dash.settings.local imports debug_toolbar (requirements/local.txt)
          pip install "django-debug-toolbar==4.3.0"

      - name: Install contract-test dependencies
        working-directory: rust-api/contract-tests
        run: pip install -r requirements.txt

      - name: Migrate contract database
        working-directory: apps/api
        run: python manage.py migrate --no-input

      - name: Create minio bucket
        run: |
          pip install minio
          python - <<'EOF'
          import time
          from minio import Minio
          client = Minio("localhost:9000", access_key="minioadmin",
                         secret_key="minioadmin", secure=False)
          for _ in range(30):
              try:
                  if not client.bucket_exists("pi-dash-contract"):
                      client.make_bucket("pi-dash-contract")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("minio never became ready")
          EOF

      - name: Start Django API
        working-directory: apps/api
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 \
            > /tmp/contract-api.log 2>&1 &
          # TCP probe: Django returns 404 on / with DEBUG on, so don't use -f.
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/8000) >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Start Celery worker
        working-directory: apps/api
        run: |
          nohup celery -A pi_dash worker --pool=solo --loglevel=info \
            > /tmp/contract-worker.log 2>&1 &

      - name: Start Celery beat
        working-directory: apps/api
        run: |
          nohup celery -A pi_dash beat --loglevel=info \
            > /tmp/contract-beat.log 2>&1 &

      - name: Run worker-plane oracle
        working-directory: rust-api/contract-tests
        run: pytest tasks_mail tasks_webhooks tasks_cleanup tasks_ticker

      - name: Run app-project HTTP oracle (D-25)
        working-directory: rust-api/contract-tests
        run: pytest app_project

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-service-logs
          path: /tmp/contract-*.log
