name: Test desktop app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "main-test"
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
    paths:
      - "desktop/**"
      # Path dependency of desktop/src-tauri (the daemon wire protocol);
      # editing it changes no lockfile under desktop/.
      - "pidash-ipc/**"
      # Windows IPC server arm, checked on the Windows leg below.
      - "runner/src/ipc/**"
      - ".github/workflows/pull-request-test-desktop.yml"
  # Post-merge validation, same reasoning as the runner workflow: PR checks
  # don't re-run when the base moves.
  push:
    branches:
      - "main"
      # Staging branch for cross-repo work (the desktop move). Without it,
      # nothing validates main-test before or after a merge.
      - "main-test"
    paths:
      - "desktop/**"
      - "pidash-ipc/**"
      # Windows IPC server arm, checked on the Windows leg below.
      - "runner/src/ipc/**"
      - ".github/workflows/pull-request-test-desktop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: cargo test + packaging tests (${{ matrix.os }})
    # Every OS the app ships on: the crate's #[cfg(windows)] / #[cfg(unix)] /
    # #[cfg(target_os = "macos")] arms are only part of the compilation unit
    # on their own target, so a Linux-only job never builds, lints or tests
    # them. The release build compiles them but runs no tests.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install Rust toolchain (from rust-toolchain.toml)
        working-directory: desktop/src-tauri
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Debug profile: build.rs only enforces a real dist/ bundle in release,
      # so the committed placeholder is enough here.
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --all-targets --locked

      # pidash-ipc's #[cfg(windows)] named-pipe transport (owner-only DACL,
      # server-owner check: PIDESKAPP-152) only compiles on a Windows target,
      # and the runner workflow tests on Linux only. Test it here, from the
      # root workspace that owns pidash-ipc, with the desktop's pinned toolchain.
      - name: Test pidash-ipc (Windows)
        if: runner.os == 'Windows'
        # bash runs with -e: a pwsh multi-line script would ignore a failing
        # cargo command and report only the last one's exit code.
        shell: bash
        run: |
          cargo +1.93 clippy -p pidash-ipc --all-targets --locked -- -D warnings
          cargo +1.93 test -p pidash-ipc --all-targets --locked
          # The runner's Windows IPC server arm uses the same helpers; it is
          # otherwise first compiled by the release build.
          cargo +1.93 check -p pidash --locked

      # The packaging helpers are OS-independent Python; one leg is enough.
      - name: Test release packaging helpers
        if: runner.os == 'Linux'
        run: python -m unittest discover -s desktop/tests -p 'test_*.py' -v
