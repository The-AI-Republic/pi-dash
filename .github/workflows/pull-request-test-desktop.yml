name: Test desktop app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "main-test"
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
    paths:
      - "desktop/**"
      # Path dependency of desktop/src-tauri (the daemon wire protocol);
      # editing it changes no lockfile under desktop/.
      - "pidash-ipc/**"
      # Pinned agent-engine release that prepare-agent.sh stages.
      - "runner/ENGINE_VERSION"
      # The desktop shell bundles apps/web_new (PIDASH_DESKTOP_WEB=web_new),
      # so a frontend-only PR can break the desktop build and must still
      # trigger the desktop-web-new job below (PIDESKAPP-205).
      - "apps/web_new/**"
      - "packages/kit/**"
      - "packages/api-client/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pull-request-test-desktop.yml"
  # Post-merge validation, same reasoning as the runner workflow: PR checks
  # don't re-run when the base moves.
  push:
    branches:
      - "main"
      # Staging branch for cross-repo work (the desktop move). Without it,
      # nothing validates main-test before or after a merge.
      - "main-test"
    paths:
      - "desktop/**"
      - "pidash-ipc/**"
      # Pinned agent-engine release that prepare-agent.sh stages.
      - "runner/ENGINE_VERSION"
      # Same frontend paths as the pull_request trigger above (PIDESKAPP-205).
      - "apps/web_new/**"
      - "packages/kit/**"
      - "packages/api-client/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pull-request-test-desktop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: cargo test + packaging tests (${{ matrix.os }})
    # Every OS the app ships on: the crate's #[cfg(windows)] / #[cfg(unix)] /
    # #[cfg(target_os = "macos")] arms are only part of the compilation unit
    # on their own target, so a Linux-only job never builds, lints or tests
    # them. The release build compiles them but runs no tests.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install Rust toolchain (from rust-toolchain.toml)
        working-directory: desktop/src-tauri
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Debug profile: build.rs only enforces a real dist/ bundle in release,
      # so the committed placeholder is enough here.
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --all-targets --locked

      # The packaging helpers are OS-independent Python; one leg is enough.
      - name: Test release packaging helpers
        if: runner.os == 'Linux'
        run: python -m unittest discover -s desktop/tests -p 'test_*.py' -v

      # The engine ships renamed to pidash-agent-engine; Codex re-execs helper
      # copies of itself (arg0 / current_exe) to build its sandbox. If the
      # rename broke that self-location the sandbox would silently not engage.
      # This guard downloads the pinned upstream engine, runs it under its
      # shipped name, and fails the build if an out-of-bounds write is not
      # blocked — so a future CODEX_BUNDLE_VERSION bump can't ship a broken
      # sandbox. Needs no model, session, or credential; only the download of
      # the pinned release uses the network. See PDASHOSS01-162, design §24.8.
      - name: Sandbox survives the engine rename (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python desktop/tests/sandbox_rename_smoke.py --stage

  desktop-web-new:
    name: desktop web_new build (PIDASH_DESKTOP_WEB=web_new)
    # Linux is enough to catch bundle/shell regressions; the native matrix
    # above covers per-OS Rust arms in debug. Release guards (build.rs)
    # only run in release, so this job compiles in release. The desktop
    # parity specs (PIDESKAPP-205) run against the built desktop bundle
    # through the seeded stack and the tauri-mock driver.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            patchelf \
            rsync

      - name: Install Rust toolchain (from rust-toolchain.toml)
        working-directory: desktop/src-tauri
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      # The exact command a developer runs locally for the new frontend:
      # clean checkout -> dev-prep web_new branch (kit build + desktop
      # bundle into desktop/src-tauri/dist/). A clean tree has no
      # packages/kit/dist, so this also pins the PIDESKAPP-185 order.
      #
      # The hosted origin is the namespaced stack's oracle URL (derived
      # from PARITY_NS exactly like parity-env.sh), not a placeholder: the
      # desktop rows assert shareable links and opener hand-offs resolve
      # against it (DESK-019/DESK-013). The stack is not up yet, but the
      # URL is deterministic from the namespace.
      - name: Build desktop bundle from web_new (dev-prep)
        env:
          PIDASH_DESKTOP_WEB: "web_new"
          PARITY_NS: "205"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PARITY_ENV_OUT="$(apps/web_new/e2e/parity/stack/parity-env.sh)" || exit $?
          eval "$PARITY_ENV_OUT"
          export PI_DASH_URL="$PARITY_ORACLE_URL"
          export VITE_WEB_BASE_URL="$PARITY_ORACLE_URL"
          export VITE_API_BASE_URL="https://pidash.example.com"
          bash desktop/scripts/dev-prep.sh

      # Release profile runs build.rs's bundle guards (size/marker for
      # web_new, PIDESKAPP-184). `cargo build` skips the tauri CLI's
      # beforeBuildCommand, so dev-prep is not re-run; dist/ is already
      # populated by the previous step. The hosted origin is the same
      # namespaced stack oracle URL dev-prep baked in (derived from
      # PARITY_NS through parity-env.sh, not hardcoded): a namespace
      # change must move both together.
      - name: Release build of the Tauri shell
        working-directory: desktop/src-tauri
        env:
          PARITY_NS: "205"
          VITE_API_BASE_URL: "https://pidash.example.com"
        run: |
          set -euo pipefail
          PARITY_ENV_OUT="$(../../apps/web_new/e2e/parity/stack/parity-env.sh)" || exit $?
          eval "$PARITY_ENV_OUT"
          export PI_DASH_URL="$PARITY_ORACLE_URL"
          export VITE_WEB_BASE_URL="$PARITY_ORACLE_URL"
          cargo build --release --locked

      - name: Install Playwright browsers
        working-directory: apps/web_new
        run: pnpm exec playwright install --with-deps chromium

      # One scratch stack per job (PARITY_NS names its containers, ports,
      # volumes and seed file). parity-up.sh builds the scratch API image,
      # starts pg/redis/mq/api/minio/proxy, waits, seeds the deterministic
      # workspace and warms the oracle. The prints at the end (PARITY_*)
      # are re-derived by the test steps via parity-env.sh; each Actions
      # step is a fresh shell, so nothing is carried over implicitly.
      - name: Bring up the parity stack
        env:
          PARITY_NS: "205"
        run: apps/web_new/e2e/parity/stack/parity-up.sh

      # RUN rows assert web-observable behavior (absence/refusals) and need
      # the web build: on the desktop build the app renders the
      # desktop-unavailable card instead of the sign-in form, so their
      # entry flow never starts. The DESK rows need the desktop build
      # (tauri-mock driver). Both run against the same seeded stack, in
      # two serve phases. Only the `new` project runs: the oracle legs
      # exercise apps/web, which the legacy workflows cover.
      - name: Build web dist for runners parity rows
        working-directory: apps/web_new
        run: pnpm build:web

      - name: Run runners parity rows (web build)
        env:
          PARITY_NS: "205"
        run: |
          set -euo pipefail
          PARITY_ENV_OUT="$(apps/web_new/e2e/parity/stack/parity-env.sh)" || exit $?
          eval "$PARITY_ENV_OUT"
          # parity-env.sh does not print the container names; the server
          # helpers shell into the API container by name, so derive it the
          # same way parity-up.sh does (prefix + "-api") or specs would exec
          # into the default parity19-api, which does not exist here.
          export PARITY_API_CONTAINER="${PARITY_CONTAINER_PREFIX}-api"
          cd apps/web_new
          PARITY_NEW_DIST=web pnpm parity:serve-new > /tmp/parity-serve-web.log 2>&1 &
          SERVE_PID=$!
          # pkill as well: `pnpm` spawns the server as a child, and killing
          # only the wrapper would leave the server bound to :3010.
          trap 'kill $SERVE_PID 2>/dev/null || true; pkill -f serve-new-prod 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3010/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3010/ >/dev/null || { cat /tmp/parity-serve-web.log; exit 1; }
          # Via the pnpm script, not `node ...` directly: run-parity.mjs
          # spawns the bare `playwright` binary, which is only on PATH in a
          # pnpm script's environment. RUN-044 is stale vs current app
          # behavior (NEWFRONT-1056) and stays excluded until fixed.
          pnpm test:parity:new -- e2e/parity/runners/desktop-runtime.spec.ts --grep-invert "RUN-044"

      - name: Run desktop parity specs (web_new desktop build)
        env:
          PARITY_NS: "205"
        run: |
          set -euo pipefail
          PARITY_ENV_OUT="$(apps/web_new/e2e/parity/stack/parity-env.sh)" || exit $?
          eval "$PARITY_ENV_OUT"
          export PARITY_API_CONTAINER="${PARITY_CONTAINER_PREFIX}-api"
          cd apps/web_new
          PARITY_NEW_DIST=desktop pnpm parity:serve-new > /tmp/parity-serve-desktop.log 2>&1 &
          SERVE_PID=$!
          trap 'kill $SERVE_PID 2>/dev/null || true; pkill -f serve-new-prod 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3010/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3010/ >/dev/null || { cat /tmp/parity-serve-desktop.log; exit 1; }
          # DESK-002/DESK-025 are stale vs current app behavior
          # (NEWFRONT-1056) and stay excluded until fixed.
          pnpm test:parity:new -- \
            e2e/parity/desktop/shell/shell.spec.ts \
            e2e/parity/desktop/sign-in/sign-in.spec.ts \
            e2e/parity/desktop/updater/updater.spec.ts \
            e2e/parity/desktop/agent-runtime/agent-runtime.spec.ts \
            --grep-invert "DESK-002|DESK-025"

      # On failure keep the Playwright evidence (error-context.md, traces,
      # parity-results.json) and the serve logs: without them a red DESK leg
      # cannot be diagnosed from the run (PIDESKAPP-205 review).
      - name: Upload parity failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-desktop-failure-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            apps/web_new/test-results/
            /tmp/parity-serve-web.log
            /tmp/parity-serve-desktop.log

      - name: Tear down the parity stack
        if: always()
        env:
          PARITY_NS: "205"
        run: apps/web_new/e2e/parity/stack/parity-down.sh || true
