name: Test desktop app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"
      - "main-test"
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
    paths:
      - "desktop/**"
      # Path dependency of desktop/src-tauri (the daemon wire protocol);
      # editing it changes no lockfile under desktop/.
      - "pidash-ipc/**"
      # Pinned agent-engine release that prepare-agent.sh stages.
      - "runner/ENGINE_VERSION"
      # The desktop shell bundles apps/web_new (PIDASH_DESKTOP_WEB=web_new),
      # so a frontend-only PR can break the desktop build and must still
      # trigger the desktop-web-new job below (PIDESKAPP-205).
      - "apps/web_new/**"
      - "packages/kit/**"
      - "packages/api-client/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pull-request-test-desktop.yml"
  # Post-merge validation, same reasoning as the runner workflow: PR checks
  # don't re-run when the base moves.
  push:
    branches:
      - "main"
      # Staging branch for cross-repo work (the desktop move). Without it,
      # nothing validates main-test before or after a merge.
      - "main-test"
    paths:
      - "desktop/**"
      - "pidash-ipc/**"
      # Pinned agent-engine release that prepare-agent.sh stages.
      - "runner/ENGINE_VERSION"
      # Same frontend paths as the pull_request trigger above (PIDESKAPP-205).
      - "apps/web_new/**"
      - "packages/kit/**"
      - "packages/api-client/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pull-request-test-desktop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: cargo test + packaging tests (${{ matrix.os }})
    # Every OS the app ships on: the crate's #[cfg(windows)] / #[cfg(unix)] /
    # #[cfg(target_os = "macos")] arms are only part of the compilation unit
    # on their own target, so a Linux-only job never builds, lints or tests
    # them. The release build compiles them but runs no tests.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install Rust toolchain (from rust-toolchain.toml)
        working-directory: desktop/src-tauri
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Debug profile: build.rs only enforces a real dist/ bundle in release,
      # so the committed placeholder is enough here.
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --all-targets --locked

      # The packaging helpers are OS-independent Python; one leg is enough.
      - name: Test release packaging helpers
        if: runner.os == 'Linux'
        run: python -m unittest discover -s desktop/tests -p 'test_*.py' -v

      # The engine ships renamed to pidash-agent-engine; Codex re-execs helper
      # copies of itself (arg0 / current_exe) to build its sandbox. If the
      # rename broke that self-location the sandbox would silently not engage.
      # This guard downloads the pinned upstream engine, runs it under its
      # shipped name, and fails the build if an out-of-bounds write is not
      # blocked — so a future CODEX_BUNDLE_VERSION bump can't ship a broken
      # sandbox. Needs no model, session, or credential; only the download of
      # the pinned release uses the network. See PDASHOSS01-162, design §24.8.
      - name: Sandbox survives the engine rename (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python desktop/tests/sandbox_rename_smoke.py --stage

  desktop-web-new:
    name: desktop web_new build (PIDASH_DESKTOP_WEB=web_new)
    # Linux is enough to catch bundle/shell regressions; the native matrix
    # above covers per-OS Rust arms in debug. Release guards (build.rs)
    # only run in release, so this job compiles in release.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            patchelf \
            rsync

      - name: Install Rust toolchain (from rust-toolchain.toml)
        working-directory: desktop/src-tauri
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      # The exact command a developer runs locally for the new frontend:
      # clean checkout -> dev-prep web_new branch (kit build + desktop
      # bundle into desktop/src-tauri/dist/). A clean tree has no
      # packages/kit/dist, so this also pins the PIDESKAPP-185 order.
      - name: Build desktop bundle from web_new (dev-prep)
        env:
          PIDASH_DESKTOP_WEB: "web_new"
          PI_DASH_URL: "https://pidash.example.com"
          VITE_API_BASE_URL: "https://pidash.example.com"
          VITE_WEB_BASE_URL: "https://pidash.example.com"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash desktop/scripts/dev-prep.sh

      # Release profile runs build.rs's bundle guards (size/marker for
      # web_new, PIDESKAPP-184). `cargo build` skips the tauri CLI's
      # beforeBuildCommand, so dev-prep is not re-run; dist/ is already
      # populated by the previous step.
      - name: Release build of the Tauri shell
        working-directory: desktop/src-tauri
        env:
          PI_DASH_URL: "https://pidash.example.com"
          VITE_API_BASE_URL: "https://pidash.example.com"
          VITE_WEB_BASE_URL: "https://pidash.example.com"
        run: cargo build --release --locked
