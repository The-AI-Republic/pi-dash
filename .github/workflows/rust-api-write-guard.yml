name: rust-api-write-guard

# ORM-09 (design D7): ratchet against new writes to ORM-covered tables outside
# pidash_services::domain. Pure Python, no DB. Runs on push to rust-dev and on
# pull requests into rust-dev (OVL-01, PIDASHCONV-1539); the heavy contract
# suites stay push-only. Advisory like all rust-api CI -- it does not gate
# merge, per the rulebook; a red PR check must be explained in the PR body
# before merge. The gate is the local check in rust-api/README.md.
on:
  push:
    branches: [rust-dev]
    paths:
      - "rust-api/**"
      - ".github/workflows/rust-api-write-guard.yml"
  pull_request:
    branches: [rust-dev]
    paths:
      - "rust-api/**"
      - ".github/workflows/rust-api-write-guard.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  write-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run write guard
        run: python3 rust-api/scripts/write_guard.py --check
      - name: Allowlist count
        if: always()
        run: |
          N=$(grep -vE '^\s*(#|$)' rust-api/scripts/write_guard_allowlist.txt | wc -l)
          echo "write-guard allowlist entries: $N" >> "$GITHUB_STEP_SUMMARY"
