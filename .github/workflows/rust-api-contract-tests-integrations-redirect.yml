name: rust-api-contract-tests-integrations-redirect

# PIDASHCONV-1472: renamed-repo redirects (301/307) followed on both backends.
# Each job boots its worker pointed at the test's redirect stub and runs only
# the redirect suite (no shared worker, no beat):
#
# - Django job: the celery worker boots with HTTPS_PROXY at the test's MITM
#   proxy (fixed GITHUB_REDIRECT_MITM_PORT) and REQUESTS_CA_BUNDLE at the
#   bundle the test module mints (test CA + system roots). The proxy MITMs
#   api.github.com and serves the 301/307 routes in-tunnel. Django follows
#   redirects, so this leg is the oracle: it proves the cases encode real
#   Django behavior.
# - Rust job: pidash-api worker boots with PIDASH_GITHUB_API_BASE at the
#   test's plain-HTTP stub (fixed GITHUB_REDIRECT_STUB_PORT), which rustls
#   never has to verify. Fails on Policy::none (HTTP 301 transport error),
#   passes on Policy::limited(10).
#
# Fixed ports follow the STALL_S3_PORT precedent: the worker dials a base
# baked into its boot env, and the test module binds the listener itself at
# run time (both backends dial lazily per task run, so each listener only
# needs to exist while its tests run).

on:
  push:
    branches: [rust-dev]
    paths:
      - "rust-api/**"
      - ".github/workflows/rust-api-contract-tests-integrations-redirect.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrations-redirect-django:
    name: redirect suite vs Django worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: pi_dash
          POSTGRES_PASSWORD: pi_dash
          POSTGRES_DB: pi_dash
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13.6-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pi_dash
          RABBITMQ_DEFAULT_PASS: pi_dash
          RABBITMQ_DEFAULT_VHOST: pi_dash
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: pi_dash.settings.local
      POSTGRES_USER: pi_dash
      POSTGRES_PASSWORD: pi_dash
      POSTGRES_DB: pi_dash
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: pi_dash
      RABBITMQ_PASSWORD: pi_dash
      RABBITMQ_VHOST: pi_dash
      WEB_URL: http://localhost
      APP_BASE_URL: http://localhost
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "0"
      EMAIL_USE_SSL: "0"
      EMAIL_FROM: Pi Dash Contract <contract@example.com>
      SECRET_KEY: "contract-tests-fixed-secret"
      DATABASE_URL: postgresql://pi_dash:pi_dash@localhost:5432/pi_dash
      CELERY_BROKER_URL: amqp://pi_dash:pi_dash@localhost:5672/pi_dash
      CONTRACT_TASK_TIMEOUT: "60"
      GITHUB_REDIRECT_MITM_PORT: "14722"
      GITHUB_REDIRECT_CA_BUNDLE: /tmp/pidash-1472-ca-bundle.pem
      HTTPS_PROXY: http://127.0.0.1:14722
      REQUESTS_CA_BUNDLE: /tmp/pidash-1472-ca-bundle.pem
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements/base.txt
            apps/api/requirements/test.txt
            rust-api/contract-tests/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          # pi_dash.settings.local imports debug_toolbar (requirements/local.txt)
          pip install "django-debug-toolbar==4.3.0"

      - name: Install contract-test dependencies
        working-directory: rust-api/contract-tests
        run: pip install -r requirements.txt

      - name: Migrate contract database
        working-directory: apps/api
        run: python manage.py migrate --no-input

      - name: Start Celery worker (solo, MITM proxy env, no beat)
        working-directory: apps/api
        run: |
          # Same oracle includes as the worker-plane job (PIDASHCONV-1104):
          # task modules the stock worker never imports (PDASHOSS01-292).
          INCLUDES=$(grep -v '^[[:space:]]*#' ../../rust-api/contract-tests/_harness/oracle_worker_includes.txt | grep -v '^[[:space:]]*$' | paste -sd,)
          nohup celery -A pi_dash worker -E --pool=solo -I "$INCLUDES" --loglevel=info \
            > /tmp/contract-redirect-worker.log 2>&1 &

      - name: Run redirect oracle (Django)
        working-directory: rust-api/contract-tests
        # Same plugin dodge as the worker-plane job: the API install puts
        # pytest-django in this interpreter; the oracle never touches Django.
        run: env -u DJANGO_SETTINGS_MODULE pytest -p no:django integrations/test_github_redirect.py -v

      - name: Upload worker log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-redirect-worker-log
          path: /tmp/contract-redirect-worker.log

  integrations-redirect-rust:
    name: redirect suite vs Rust worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: pi_dash
          POSTGRES_PASSWORD: pi_dash
          POSTGRES_DB: pi_dash
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13.6-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pi_dash
          RABBITMQ_DEFAULT_PASS: pi_dash
          RABBITMQ_DEFAULT_VHOST: pi_dash
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: pi_dash.settings.local
      POSTGRES_USER: pi_dash
      POSTGRES_PASSWORD: pi_dash
      POSTGRES_DB: pi_dash
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: pi_dash
      RABBITMQ_PASSWORD: pi_dash
      RABBITMQ_VHOST: pi_dash
      WEB_URL: http://localhost
      APP_BASE_URL: http://localhost
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "0"
      EMAIL_USE_SSL: "0"
      EMAIL_FROM: Pi Dash Contract <contract@example.com>
      SECRET_KEY: "contract-tests-fixed-secret"
      BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://pi_dash:pi_dash@localhost:5432/pi_dash
      CELERY_BROKER_URL: amqp://pi_dash:pi_dash@localhost:5672/pi_dash
      CONTRACT_TASK_TIMEOUT: "60"
      GITHUB_REDIRECT_STUB_PORT: "14721"
      PIDASH_GITHUB_API_BASE: http://127.0.0.1:14721
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements/base.txt
            apps/api/requirements/test.txt
            rust-api/contract-tests/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-api

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install "django-debug-toolbar==4.3.0"

      - name: Install contract-test dependencies
        working-directory: rust-api/contract-tests
        run: pip install -r requirements.txt

      - name: Migrate contract database
        working-directory: apps/api
        run: python manage.py migrate --no-input

      - name: Build Rust worker
        working-directory: rust-api
        run: cargo build --bin pidash-api

      - name: Start Rust worker (Django worker stays stopped)
        working-directory: rust-api
        run: |
          # Fresh test-only RSA key for the github_app mint path (the
          # integration replay seeds the app id/slug in
          # instance_configurations while the private key stays
          # env-sourced). Generated per run so no key material is ever
          # committed (PIDASHCONV-1471).
          openssl genrsa -out /tmp/contract-github-app.pem 2048 2>/dev/null
          export GITHUB_APP_PRIVATE_KEY
          GITHUB_APP_PRIVATE_KEY="$(cat /tmp/contract-github-app.pem)"
          rm -f /tmp/contract-github-app.pem
          nohup ./target/debug/pidash-api worker \
            > /tmp/contract-redirect-rust-worker.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "worker + scheduler loops started" /tmp/contract-redirect-rust-worker.log && break
            sleep 2
          done
          grep -q "worker + scheduler loops started" /tmp/contract-redirect-rust-worker.log

      - name: Run redirect replay (Rust)
        working-directory: rust-api/contract-tests
        # Same plugin dodge as the Django oracle job: the API install puts
        # pytest-django in this interpreter; the replay never touches Django.
        run: env -u DJANGO_SETTINGS_MODULE pytest -p no:django integrations/test_rust_replay_redirect.py -v

      - name: Upload worker log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-redirect-rust-worker-log
          path: /tmp/contract-redirect-rust-worker.log
