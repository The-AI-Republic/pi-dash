name: Release Rust Platform

on:
  push:
    tags: ['rust-platform-v*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Rust platform tag (e.g. rust-platform-v0.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

# Serialize releases, including tag-push / manually-published-release duplicates,
# so overlapping releases cannot interleave updates to stable/latest aliases.
concurrency:
  group: rust-platform-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'rust-platform-v')
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Test release metadata handling
        run: python3 -m unittest discover -s .github/tests -v
      - name: Validate release version
        id: version
        run: python3 .github/release_tools/rust_release.py
      - name: Resolve the tagged commit
        id: commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          echo "sha=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: Build and smoke ${{ matrix.component }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
          - component: backend
            image: airepublic/pi-dash-backend-rust
            dockerfile: rust-api/Dockerfile.api
          - component: frontend
            image: airepublic/pi-dash-web-new-rust
            dockerfile: apps/web_new/Dockerfile.web-new
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Build native image for smoke testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: pidash-release:test
          cache-from: type=gha,scope=rust-release-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rust-release-${{ matrix.component }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Smoke Rust runtime
        if: matrix.component == 'backend'
        run: |
          set -euo pipefail
          docker run --rm pidash-release:test pidash-api serve --help
          docker run --rm pidash-release:test pidash-api worker --help
          docker run --rm pidash-release:test pidash-api ops wait_for_db --help
          docker run --rm pidash-release:test bash -ec '
            test -s /code/package.json
            test -d /code/seeds
            command -v hostname ip free
            for script in /code/bin/*.sh; do bash -n "$script"; done
          '
      - name: Smoke web bundle and SPA fallback
        if: matrix.component == 'frontend'
        run: |
          set -euo pipefail
          container=$(docker run -d pidash-release:test)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container" curl -fsS http://127.0.0.1:3000/ > /tmp/index.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/index.html
          docker exec "$container" curl -fsS http://127.0.0.1:3000/sign-in/ > /tmp/route.html
          cmp /tmp/index.html /tmp/route.html
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested architecture image
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
          COMMIT: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          staging="${IMAGE}:${VERSION}-${ARCH}-${COMMIT}"
          docker tag pidash-release:test "$staging"
          docker push "$staging"

  publish:
    needs: [plan, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-architecture version manifests
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for image in airepublic/pi-dash-backend-rust airepublic/pi-dash-web-new-rust; do
            docker buildx imagetools create --tag "${image}:${VERSION}" \
              "${image}:${VERSION}-amd64-${COMMIT}" "${image}:${VERSION}-arm64-${COMMIT}"
            docker buildx imagetools inspect "${image}:${VERSION}" --raw \
              > "release-assets/${image##*/}.manifest.json"
          done
      - name: Promote final releases within Rust image repositories
        if: needs.plan.outputs.prerelease == 'false'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for image in airepublic/pi-dash-backend-rust airepublic/pi-dash-web-new-rust; do
            docker buildx imagetools create --tag "${image}:stable" --tag "${image}:latest" "${image}:${VERSION}"
          done
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          COMMIT: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          cp deployments/rust/README.md release-assets/README.md
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          record = {
              'tag': os.environ['RELEASE_TAG'],
              'version': version,
              'commit': os.environ['COMMIT'],
              'platforms': ['linux/amd64', 'linux/arm64'],
              'backend': f'airepublic/pi-dash-backend-rust:{version}',
              'frontend': f'airepublic/pi-dash-web-new-rust:{version}',
          }
          Path('release-assets/images.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          cat release-assets/images.json >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the separate Rust release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: Rust Platform ${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: 'false'
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
