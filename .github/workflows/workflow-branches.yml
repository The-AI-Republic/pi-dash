# Workflow branch-filter guard: fails if any workflow's on: branches /
# branches-ignore filter names `master` (the default branch is main). Also runs
# the unit tests of the release version check that build-branch.yml uses.
name: workflow-branches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/check-*.mjs"
      - ".github/scripts/package*.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/check-*.mjs"
      - ".github/scripts/package*.json"

jobs:
  guard:
    name: no master branch filters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install the pinned YAML parser
        run: npm ci --prefix .github/scripts --no-audit --no-fund
      - name: Unit tests for the guard and the release version check
        run: node --test .github/scripts/check-workflow-branches.test.mjs .github/scripts/check-release-version.test.mjs
      - name: Check workflow branch filters
        run: node .github/scripts/check-workflow-branches.mjs
