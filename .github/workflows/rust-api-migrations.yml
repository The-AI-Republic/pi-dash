name: rust-api-migrations

# NEWPIDASH-380: the native Rust migrator owns the schema. This workflow
# proves `pidash-api migrate up` on an empty Postgres produces a schema
# identical to Django `migrate` at the same leaf (compare_schema.py, in
# the style of the cloud oracle.py compare), that `up` is a no-op on a
# Django-migrated database, that a fallback Django sees nothing to apply
# on a Rust-built database, and that failures are fail-fast and named.

on:
  pull_request:
    paths:
      - "rust-api/crates/migration/**"
      - "rust-api/bin/docker-entrypoint-*.sh"
      - "rust-api/bin/pidash-api/**"
      - "rust-api/contract-tests/migrations/**"
      - "rust-api/contract-tests/ops/test_image.py"
      - "apps/api/pi_dash/**/migrations/**"
      - ".github/workflows/rust-api-migrations.yml"
  push:
    branches: [main]
    paths:
      - "rust-api/crates/migration/**"
      - "rust-api/bin/docker-entrypoint-*.sh"
      - "rust-api/bin/pidash-api/**"
      - "rust-api/contract-tests/migrations/**"
      - "rust-api/contract-tests/ops/test_image.py"
      - "apps/api/pi_dash/**/migrations/**"
      - ".github/workflows/rust-api-migrations.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations:
    name: native migrator parity with Django
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-test
          POSTGRES_DB: pidash_migration_ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:migration-test@localhost:5432/pidash_migration_ci
      SECRET_KEY: disposable-migration-test
      WEB_URL: http://127.0.0.1:8123
      APP_BASE_URL: http://127.0.0.1:8123
      REDIS_URL: redis://127.0.0.1:6379/9
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements/production.txt
            rust-api/contract-tests/requirements.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-api

      - name: Install Django oracle dependencies
        run: pip install -r apps/api/requirements/production.txt

      - name: Install contract-test dependencies
        working-directory: rust-api/contract-tests
        run: pip install -r requirements.txt

      - name: Build pidash-api binary
        working-directory: rust-api
        run: cargo build --bin pidash-api

      - name: Migrate the Django leaf database
        working-directory: apps/api
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE pidash_django_leaf;"
          DATABASE_URL="postgresql://postgres:migration-test@localhost:5432/pidash_django_leaf" \
            python manage.py migrate --no-input

      - name: Migrate up the empty database with the Rust migrator
        env:
          MIGRATOR_DATABASE_URL: postgresql://postgres:migration-test@localhost:5432/pidash_migration_ci
        run: |
          ./rust-api/target/debug/pidash-api migrate status
          ./rust-api/target/debug/pidash-api migrate check && exit 1 || echo "check correctly fails on the empty database"
          ./rust-api/target/debug/pidash-api migrate up

      - name: Compare Rust-built schema with the Django leaf
        run: |
          python rust-api/contract-tests/migrations/compare_schema.py \
            rust-fresh "postgresql://postgres:migration-test@localhost:5432/pidash_migration_ci" \
            django-leaf "postgresql://postgres:migration-test@localhost:5432/pidash_django_leaf"

      - name: Up is a no-op on the Django-migrated database
        env:
          DATABASE_URL: postgresql://postgres:migration-test@localhost:5432/pidash_django_leaf
          MIGRATOR_DATABASE_URL: postgresql://postgres:migration-test@localhost:5432/pidash_django_leaf
        run: |
          ./rust-api/target/debug/pidash-api migrate up
          ./rust-api/target/debug/pidash-api migrate check
          python rust-api/contract-tests/migrations/compare_schema.py \
            rust-fresh "postgresql://postgres:migration-test@localhost:5432/pidash_migration_ci" \
            django-leaf "postgresql://postgres:migration-test@localhost:5432/pidash_django_leaf"

      - name: Fallback Django sees nothing to apply on the Rust database
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:migration-test@localhost:5432/pidash_migration_ci
        run: python manage.py migrate --check

      - name: Broken migration fails fast and names itself
        env:
          DATABASE_URL: postgresql://postgres:migration-test@localhost:5432/pidash_migration_broken
          MIGRATOR_DATABASE_URL: postgresql://postgres:migration-test@localhost:5432/pidash_migration_broken
        run: |
          # CREATE DATABASE cannot run from inside the database being created,
          # so connect to the service (maintenance) database instead.
          psql "postgresql://postgres:migration-test@localhost:5432/pidash_migration_ci" -c "CREATE DATABASE pidash_migration_broken;"
          # A table the snapshot also creates, with a conflicting shape.
          psql "$MIGRATOR_DATABASE_URL" -c "CREATE TABLE public.accounts (id integer PRIMARY KEY);"
          if ./rust-api/target/debug/pidash-api migrate up; then
            echo "up unexpectedly passed on the broken database"
            exit 1
          fi
          ./rust-api/target/debug/pidash-api migrate check && exit 1 || echo "check correctly fails after the broken up"
