name: rust-api-contract-tests-exports

# PIDASHCONV-1106: Django oracle for the export tasks. The stock
# contract worker rejects issue_export_task / analytic_export_task as
# unregistered (PDASHOSS01-292), so this job starts NO shared worker:
# the suite boots its own Django worker with the task modules
# force-included (-I; see _harness/export_worker.py). Pins the
# committed captures (exports/captures/) byte-for-byte.

on:
  push:
    branches: [rust-dev]
    paths:
      - "rust-api/**"
      - ".github/workflows/rust-api-contract-tests-exports.yml"
  pull_request:
    paths:
      - "rust-api/**"
      - ".github/workflows/rust-api-contract-tests-exports.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exports-oracle:
    name: exports Django oracle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: pi_dash
          POSTGRES_PASSWORD: pi_dash
          POSTGRES_DB: pi_dash
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: valkey/valkey:7.2.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: pi_dash.settings.local
      POSTGRES_USER: pi_dash
      POSTGRES_PASSWORD: pi_dash
      POSTGRES_DB: pi_dash
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/
      WEB_URL: http://localhost
      APP_BASE_URL: http://localhost
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "0"
      EMAIL_USE_SSL: "0"
      EMAIL_FROM: Pi Dash Contract <contract@example.com>
      USE_MINIO: "1"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_STORAGE_BUCKET_NAME: pi-dash-contract
      AWS_S3_BUCKET_NAME: pi-dash-contract
      AWS_S3_ENDPOINT_URL: http://localhost:4566
      BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://pi_dash:pi_dash@localhost:5432/pi_dash
      CELERY_BROKER_URL: redis://localhost:6379/0
      CONTRACT_REDIS_URL: redis://localhost:6379/0
      CONTRACT_TASK_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements/base.txt
            apps/api/requirements/test.txt
            rust-api/contract-tests/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          # pi_dash.settings.local imports debug_toolbar (requirements/local.txt)
          pip install "django-debug-toolbar==4.3.0"

      - name: Install contract-test dependencies
        working-directory: rust-api/contract-tests
        run: pip install -r requirements.txt

      - name: Migrate contract database
        working-directory: apps/api
        run: python manage.py migrate --no-input

      # S3 is LocalStack, not MinIO: quay.io now rejects anonymous pulls
      # ("unauthorized", verified 2026-09-26) and Docker Hub no longer
      # serves minio/minio.
      - name: Start S3 (LocalStack)
        run: |
          docker run -d --name contract-s3 -p 4566:4566 \
            -e SERVICES=s3 \
            localstack/localstack:4.5.0
          for i in $(seq 1 45); do
            curl -sf http://localhost:4566/_localstack/health && break
            sleep 2
          done

      - name: Create S3 bucket
        run: |
          pip install minio
          python - <<'EOF'
          import time
          from minio import Minio
          client = Minio("localhost:4566", access_key="minioadmin",
                         secret_key="minioadmin", secure=False)
          for _ in range(30):
              try:
                  if not client.bucket_exists("pi-dash-contract"):
                      client.make_bucket("pi-dash-contract")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("S3 never became ready")
          EOF

      # No shared Celery worker here: the exports suite boots its own
      # Django worker with -I (see _harness/export_worker.py), and a
      # stock worker would race it for the same queue.

      - name: Run exports Django oracle
        working-directory: rust-api/contract-tests
        run: pytest exports/test_oracle_exports.py -v

      - name: Upload oracle worker log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-export-oracle-worker-log
          path: /tmp/export-oracle-worker.log
