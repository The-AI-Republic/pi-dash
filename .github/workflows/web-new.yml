# CI for the new frontend (NEWFRONT-12). Runs on PRs into main and on pushes
# to it. Every PR into main gets a web-new-required result: PRs that touch no
# frontend path skip the jobs and pass, so the check can be required on main.
name: web-new

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/web_new/**"
      - "packages/kit/**"
      - "packages/api-client/**"
      - ".ai_design/new_frontend_implementation/parity/**"
      - ".github/workflows/web-new*.yml"
      - "pnpm-lock.yaml"
      - "desktop/scripts/dev-prep.sh"
      - "desktop/tests/**"

# A new push to a PR replaces its running CI. Pushes to main never
# cancel a running push run: the next one waits, and newer merges collapse
# into that one pending run, so every completed run covers all merges since
# the previous one. Push runs no longer include the web_new unit suite; the
# NEWFRONT full-suite scheduler runs it on main every 12 hours.
concurrency:
  group: web-new-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  changes:
    name: frontend paths changed
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit plus its first parent, the base it merges onto.
          fetch-depth: 2
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        # Keep this list in step with the push paths above.
        run: |
          frontend=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pattern='^(apps/web_new/|packages/kit/|packages/api-client/|\.ai_design/new_frontend_implementation/parity/|\.github/workflows/web-new[^/]*\.yml$|pnpm-lock\.yaml$|desktop/scripts/dev-prep\.sh$|desktop/tests/)'
            git diff --name-only HEAD^1 HEAD | grep -Eq "$pattern" || frontend=false
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "frontend paths changed: $frontend"

  install:
    name: install
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web_new typecheck
      - run: pnpm --filter @pidash/kit typecheck
      - run: pnpm --filter @pidash/api-client typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web_new lint
      - run: pnpm --filter @pidash/kit lint
      - run: pnpm --filter @pidash/api-client lint
      - run: pnpm --filter web_new check:boundaries
      - run: pnpm --filter web_new check:headers
      - run: pnpm --filter web_new check:deps
      - run: pnpm --filter web_new check:coexistence
      - run: pnpm --filter web_new check:oracle-build

  similarity:
    name: similarity check (new vs old frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node apps/web_new/checks/check-similarity.mjs

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit plus its first parent, the base it merges onto.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A PR runs only the tests its change can affect. Pushes to main skip
      # the web_new unit tests: the NEWFRONT full-suite scheduler runs the
      # whole suite on main every 12 hours and files fix issues.
      - name: unit tests affected by the PR
        if: github.event_name == 'pull_request'
        working-directory: apps/web_new
        run: node checks/test-changed.mjs --base HEAD^1
      - run: pnpm --filter web_new test:coexistence
      - run: pnpm --filter web_new test:size-initial
      - run: pnpm --filter web_new test:parity-report
      - run: pnpm --filter web_new test:parity-stack
      - run: pnpm --filter web_new test:parity-disk-check
      - run: pnpm --filter @pidash/kit test
      - run: pnpm --filter @pidash/api-client test

  build:
    name: build (web + desktop)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit, similarity]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pidash/kit build
      - run: pnpm --filter @pidash/api-client build
      - run: pnpm --filter web_new build
      - name: Show bundles
        run: |
          export WEB_DIR="apps/web_new/dist/web"
          export DESKTOP_DIR="apps/web_new/dist/desktop"
          ls -la "$WEB_DIR" "$DESKTOP_DIR"
          test -f "$WEB_DIR/index.html"
          test -f "$DESKTOP_DIR/index.html"
      - name: Prove the web bundle contains no Tauri code (F-04)
        run: pnpm --filter web_new check:no-tauri

  size-limit:
    name: size-limit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pidash/kit build
      - run: pnpm --filter @pidash/api-client build
      - run: pnpm --filter web_new build
      # Fails only above the 265 KB initial-JS ceiling (and the CSS budget).
      - run: pnpm --filter web_new size
      # The 220 KB target is reported, never blocking; area gates act on it (NEWFRONT-248).
      - name: initial JS against the 220 KB target (report only, never blocks)
        working-directory: apps/web_new
        env:
          SIZE_TARGET: "1"
        run: |
          pnpm exec size-limit --json > "$RUNNER_TEMP/size.json" || true
          node -e '
            const fs = require("node:fs");
            for (const entry of JSON.parse(fs.readFileSync(process.argv[1], "utf8"))) {
              const line = `${entry.name}: ${(entry.size / 1000).toFixed(2)} kB${entry.passed ? "" : " (over the target)"}`;
              console.log(line);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${line}\n`);
              if (!entry.passed) console.log(`::warning title=Size target::${line}. Not blocking; the area gate files a diet issue.`);
            }
          ' "$RUNNER_TEMP/size.json"

  coverage-audit:
    name: coverage audit (report only, never blocks)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parity coverage audit
        run: node apps/web_new/e2e/parity/tools/coverage-audit.mjs --root . --out /tmp/coverage-audit.md || true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-audit
          path: /tmp/coverage-audit.md

  # Browser flows: a few core issue flows, driven in Chromium against
  # web_new's production build on the Rust API, before merge. Unit tests
  # cannot see bugs that live between the UI's caches and its requests
  # (NEWPIDASH-251: a state change from the peek threw in the optimistic
  # paint, so no PATCH was ever sent, and prod showed "Couldn't update the
  # work item"). The stack mirrors prod: every PIDASH_RUST_* flag on, the
  # Django upstream pointed at nothing, and the Rust worker running. Django
  # is used only to create the schema (migrate) and seed the parity
  # workspace. The specs are listed in apps/web_new/e2e/parity/ci-flows.txt;
  # add a flow there only after it passes reliably on this stack.
  e2e:
    name: browser flows (web_new on the Rust API)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pidash_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13.6-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pi_dash
          RABBITMQ_DEFAULT_PASS: pi_dash
          RABBITMQ_DEFAULT_VHOST: pi_dash
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: pi_dash.settings.test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pidash_e2e
      REDIS_URL: redis://localhost:6379/0
      AMQP_URL: amqp://pi_dash:pi_dash@localhost:5672/pi_dash
      # Scratch-only secret for a throwaway CI database.
      SECRET_KEY: e2e-ci-fixed-secret-not-used-outside-scratch
      ALLOWED_HOSTS: "*"
      WEB_URL: http://localhost:3010
      APP_BASE_URL: http://localhost:3010
      SPACE_BASE_URL: http://localhost:3010
      # Prod's Rust stack: every route served by Rust, no Django fallback.
      PIDASH_DJANGO_UPSTREAM: http://127.0.0.1:9
      PIDASH_RUST_WEB: "1"
      PIDASH_RUST_APP: "1"
      PIDASH_RUST_ASSISTANT: "1"
      PIDASH_RUST_LOOP: "1"
      PIDASH_RUST_PROMPTING: "1"
      PIDASH_RUST_SPACE: "1"
      PIDASH_RUST_LICENSE: "1"
      PIDASH_RUST_RUNNER_WEB: "1"
      PIDASH_RUST_API_V1: "1"
      PIDASH_RUST_RUNNER: "1"
      PIDASH_RUST_AUTH: "1"
      # The parity suite's addresses: web_new on :3010, the Rust API on :8080.
      PARITY_NEW_URL: http://localhost:3010
      PARITY_API_URL: http://127.0.0.1:8080
      PARITY_SEED_FILE: ${{ github.workspace }}/apps/web_new/e2e/parity/.seed.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: apps/api/requirements/base.txt
      - name: Install Django (schema + seed only)
        run: |
          sudo apt-get update -y && sudo apt-get install -y libpq-dev
          python -m pip install -r apps/api/requirements/base.txt

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-api
      - name: Build pidash-api
        working-directory: rust-api
        run: cargo build --bin pidash-api

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pidash/kit build
      - run: pnpm --filter @pidash/api-client build
      - name: Build web_new (production bundle)
        run: pnpm --filter web_new parity:build-new
      - name: Install Chromium
        working-directory: apps/web_new
        run: pnpm exec playwright install --with-deps chromium

      - name: Create the schema and seed the parity workspace
        working-directory: apps/api
        run: |
          set -euo pipefail
          python manage.py migrate --noinput
          python manage.py register_instance e2e-ci > /dev/null
          python manage.py configure_instance > /dev/null
          python manage.py shell -c "from pi_dash.license.models import Instance; Instance.objects.filter(is_setup_done=False).update(is_setup_done=True)"
          python manage.py shell < ../web_new/e2e/parity/stack/seed/seed_parity.py > "$RUNNER_TEMP/seed.out" 2>&1 || { cat "$RUNNER_TEMP/seed.out"; exit 1; }
          grep '^PARITY_SEED_JSON:' "$RUNNER_TEMP/seed.out" | sed 's/^PARITY_SEED_JSON://' | tail -n 1 > "$PARITY_SEED_FILE"
          [ -s "$PARITY_SEED_FILE" ] || { echo "seed produced no facts:"; cat "$RUNNER_TEMP/seed.out"; exit 1; }

      - name: Start the Rust API and worker
        working-directory: rust-api
        run: |
          nohup ./target/debug/pidash-api serve --bind 127.0.0.1:8080 > "$RUNNER_TEMP/rust-serve.log" 2>&1 &
          nohup ./target/debug/pidash-api worker > "$RUNNER_TEMP/rust-worker.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && { echo "Rust API is up"; exit 0; }
            sleep 2
          done
          echo "Rust API did not start:"; tail -n 50 "$RUNNER_TEMP/rust-serve.log"; exit 1

      - name: Serve web_new
        working-directory: apps/web_new
        run: |
          nohup pnpm parity:serve-new > "$RUNNER_TEMP/serve-new.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3010/ && { echo "web_new is up"; exit 0; }
            sleep 1
          done
          echo "web_new did not start:"; cat "$RUNNER_TEMP/serve-new.log"; exit 1

      - name: Run browser flows
        working-directory: apps/web_new
        run: |
          set -euo pipefail
          mapfile -t FLOWS < <(grep -vE '^\s*(#|$)' e2e/parity/ci-flows.txt)
          pnpm exec playwright test -c e2e/parity/playwright.config.ts --project=new --retries=1 \
            --reporter=line "${FLOWS[@]}"

      - name: Upload traces and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-flows
          path: |
            apps/web_new/test-results/
            ${{ runner.temp }}/rust-serve.log
            ${{ runner.temp }}/rust-worker.log
            ${{ runner.temp }}/serve-new.log
          retention-days: 7

  # The one check main requires, through a repository ruleset no one bypasses,
  # so it binds `gh pr merge --admin` too. Skipped jobs pass; failed or
  # cancelled ones do not.
  required:
    name: web-new-required
    runs-on: ubuntu-latest
    needs: [changes, install, typecheck, lint, similarity, unit, build, size-limit, e2e]
    if: always()
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
