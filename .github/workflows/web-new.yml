# CI for the new frontend (NEWFRONT-12). Runs on PRs into web-new-dev and
# on pushes to it.
name: web-new

on:
  pull_request:
    branches: [web-new-dev]
    paths:
      - "apps/web_new/**"
      - "packages/kit/**"
      - "packages/api-client/**"
      - ".ai_design/new_frontend_implementation/parity/**"
      - ".github/workflows/web-new*.yml"
      - "pnpm-lock.yaml"
      - "desktop/scripts/dev-prep.sh"
      - "desktop/tests/**"
  push:
    branches: [web-new-dev]
    paths:
      - "apps/web_new/**"
      - "packages/kit/**"
      - "packages/api-client/**"
      - ".ai_design/new_frontend_implementation/parity/**"
      - ".github/workflows/web-new*.yml"
      - "pnpm-lock.yaml"
      - "desktop/scripts/dev-prep.sh"
      - "desktop/tests/**"

concurrency:
  group: web-new-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web_new typecheck
      - run: pnpm --filter @pidash/kit typecheck
      - run: pnpm --filter @pidash/api-client typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web_new lint
      - run: pnpm --filter @pidash/kit lint
      - run: pnpm --filter @pidash/api-client lint
      - run: pnpm --filter web_new check:boundaries
      - run: pnpm --filter web_new check:headers
      - run: pnpm --filter web_new check:deps
      - run: pnpm --filter web_new check:coexistence
      - run: pnpm --filter web_new check:oracle-build

  similarity:
    name: similarity check (new vs old frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node apps/web_new/checks/check-similarity.mjs

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web_new test
      - run: pnpm --filter web_new test:coexistence
      - run: pnpm --filter web_new test:size-initial
      - run: pnpm --filter web_new test:parity-report
      - run: pnpm --filter @pidash/kit test
      - run: pnpm --filter @pidash/api-client test

  build:
    name: build (web + desktop)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit, similarity]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pidash/kit build
      - run: pnpm --filter @pidash/api-client build
      - run: pnpm --filter web_new build
      - name: Show bundles
        run: |
          export WEB_DIR="apps/web_new/dist/web"
          export DESKTOP_DIR="apps/web_new/dist/desktop"
          ls -la "$WEB_DIR" "$DESKTOP_DIR"
          test -f "$WEB_DIR/index.html"
          test -f "$DESKTOP_DIR/index.html"
      - name: Prove the web bundle contains no Tauri code (F-04)
        run: pnpm --filter web_new check:no-tauri

  size-limit:
    name: size-limit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pidash/kit build
      - run: pnpm --filter @pidash/api-client build
      - run: pnpm --filter web_new build
      - run: pnpm --filter web_new size

  coverage-audit:
    name: coverage audit (report only, never blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parity coverage audit
        run: node apps/web_new/e2e/parity/tools/coverage-audit.mjs --root . --out /tmp/coverage-audit.md || true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-audit
          path: /tmp/coverage-audit.md
