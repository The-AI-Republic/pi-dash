# Contract suites for the Rust port (PIDASHCONV stage 1).
# Import/collection gate always runs. The live-backend run needs a Django
# service + Postgres (BASE_URL / DATABASE_URL secrets); it runs when those
# are configured and otherwise reports why it cannot.
name: rust-api-contract

on:
  pull_request:
    paths:
      - "rust-api/**"
      - ".github/workflows/rust-api-contract.yml"
  push:
    branches: [rust-dev]
    paths:
      - "rust-api/**"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r rust-api/contract-tests/requirements.txt
      - run: cd rust-api/contract-tests && python -m pytest --collect-only -q

  live:
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r rust-api/contract-tests/requirements.txt
      - name: Run contract suites against the backend
        env:
          BASE_URL: ${{ secrets.CONTRACT_BASE_URL }}
          DATABASE_URL: ${{ secrets.CONTRACT_DATABASE_URL }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$DATABASE_URL" ]; then
            echo "CONTRACT_BASE_URL / CONTRACT_DATABASE_URL secrets are not configured; live run skipped."
            exit 0
          fi
          cd rust-api/contract-tests && python -m pytest -q
