# Contract suites for the Rust port (PIDASHCONV stage 1).
# Import/collection gate always runs. The live-backend run needs a Django
# service + Postgres (BASE_URL / DATABASE_URL secrets); it runs when those
# are configured and otherwise reports why it cannot.
name: rust-api-contract

on:
  push:
    branches: [main]
    paths:
      - "rust-api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.x"
      - run: pip install -r rust-api/contract-tests/requirements.txt
      - run: cd rust-api/contract-tests && python -m pytest --collect-only -q

  live:
    # Runs the whole contract tree, including the tasks_webhooks link-crawl
    # parity tests that need production's html.parser (CPython 3.12.10) and
    # skip on >=3.12.12. Same pin as the contract-tests job in
    # rust-api-contract-tests.yml and the contract-rust job in
    # rust-api-contract-rust.yml: ubuntu-24.04 still ships 3.12.10, so move
    # them together.
    runs-on: ubuntu-24.04
    needs: collect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Assert production html.parser (oracle must match CPython 3.12.10)
        run: python rust-api/contract-tests/_harness/assert_legacy_html_parser.py
      - run: pip install -r rust-api/contract-tests/requirements.txt
      - name: Run contract suites against the backend
        env:
          BASE_URL: ${{ secrets.CONTRACT_BASE_URL }}
          DATABASE_URL: ${{ secrets.CONTRACT_DATABASE_URL }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$DATABASE_URL" ]; then
            echo "CONTRACT_BASE_URL / CONTRACT_DATABASE_URL secrets are not configured; live run skipped."
            exit 0
          fi
          cd rust-api/contract-tests && python -m pytest -q
