name: Build a candidate Docker image
description: >-
  Build a Docker image into an OCI archive and upload it as a workflow
  artifact. Pushes nothing and needs no registry credentials: under the
  publication gate only the protected publisher pushes images, and it pushes
  this exact archive after the scan has passed.

inputs:
  image-name:
    description: Image repository name (without namespace); also the artifact name suffix
    required: true
  build-context:
    description: Docker build context path
    required: true
  dockerfile-path:
    description: Path to the Dockerfile
    required: true
  buildx-platforms:
    description: Target platforms (e.g. linux/amd64,linux/arm64)
    required: true
  additional-assets:
    description: Optional artifact name to download into additional-assets-dir before build
    required: false
    default: ""
  additional-assets-dir:
    description: Directory to download additional-assets into
    required: false
    default: ""
  build-args:
    description: Extra build args for docker build-push-action (newline-separated)
    required: false
    default: ""
  build-contexts:
    description: Extra named build contexts (newline-separated name=source)
    required: false
    default: ""

outputs:
  digest:
    description: Digest of the image index in the archive (what the publisher pushes)
    value: ${{ steps.digest.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Download additional assets
      if: ${{ inputs.additional-assets != '' }}
      uses: actions/download-artifact@v6
      with:
        name: ${{ inputs.additional-assets }}
        path: ${{ inputs.additional-assets-dir }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container

    - name: Build image into an OCI archive
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.build-context }}
        file: ${{ inputs.dockerfile-path }}
        platforms: ${{ inputs.buildx-platforms }}
        outputs: type=oci,dest=${{ runner.temp }}/image-candidate/${{ inputs.image-name }}.tar
        push: false
        build-args: ${{ inputs.build-args }}
        build-contexts: ${{ inputs.build-contexts }}

    - id: digest
      name: Record the image digest
      shell: bash
      env:
        ARCHIVE: ${{ runner.temp }}/image-candidate/${{ inputs.image-name }}.tar
      run: |
        set -euo pipefail
        digest="$(tar -xOf "$ARCHIVE" index.json | jq -r '.manifests[0].digest')"
        case "$digest" in sha256:*) ;; *) echo "::error::no image digest in $ARCHIVE"; exit 1 ;; esac
        echo "$digest" > "${ARCHIVE%.tar}.digest"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "${{ inputs.image-name }} $digest"

    - name: Upload the image archive
      uses: actions/upload-artifact@v7
      with:
        name: image-${{ inputs.image-name }}
        path: ${{ runner.temp }}/image-candidate/
        if-no-files-found: error
        compression-level: 0
