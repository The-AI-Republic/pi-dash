# Community CLI local-build file (NEWPIDASH-383): the active system only.
# The old frontends (web, space, admin) are frozen and never built here.
services:
  web_new:
    image: ${DOCKERHUB_USER:-local}/pi-dash-web-new:${APP_RELEASE:-latest}
    build:
      context: ../../
      dockerfile: apps/web_new/Dockerfile.web-new

  live:
    image: ${DOCKERHUB_USER:-local}/pi-dash-live:${APP_RELEASE:-latest}
    build:
      context: ../../
      dockerfile: apps/live/Dockerfile.live

  api:
    image: ${DOCKERHUB_USER:-local}/pi-dash-api:${APP_RELEASE:-latest}
    build:
      context: ../../
      dockerfile: rust-api/Dockerfile.api

  # Interim (NEWPIDASH-380): the community compose migrator runs Django
  # `manage.py migrate` from this image. It is the only Python container and
  # it exits after migrating. TODO(NEWPIDASH-380): drop this once the native
  # `pidash-api migrate up` migrator lands (the api image then serves it).
  backend:
    image: ${DOCKERHUB_USER:-local}/pi-dash-backend:${APP_RELEASE:-latest}
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api

  proxy:
    image: ${DOCKERHUB_USER:-local}/pi-dash-proxy:${APP_RELEASE:-latest}
    build:
      context: ../../apps/proxy
      dockerfile: Dockerfile.ce
