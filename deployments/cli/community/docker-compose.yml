x-db-env: &db-env
  PGHOST: ${PGHOST:-pi-dash-db}
  PGDATABASE: ${PGDATABASE:-pi-dash}
  POSTGRES_USER: ${POSTGRES_USER:-pi-dash}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pi-dash}
  POSTGRES_DB: ${POSTGRES_DB:-pi-dash}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-pi-dash-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://pi-dash-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://pi-dash-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL}
  CERT_ACME_CA: ${CERT_ACME_CA}
  CERT_ACME_DNS: ${CERT_ACME_DNS}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

# (No RabbitMQ: the Rust worker queues in Postgres. The old pi-dash-mq
# service is gone with the frozen Django/Celery stack.)

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: "${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY must be set in pi_dash.env; generate with openssl rand -hex 32}"

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://pi-dash:pi-dash@pi-dash-db/pi-dash}
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in pi_dash.env; generate with openssl rand -hex 32}"
  # Fernet key(s) for AI Assistant BYOK encryption. Blank on a fresh
  # variables.env; install.sh generates one (as Fernet, not hex).
  ASSISTANT_ENCRYPTION_KEY: ${ASSISTANT_ENCRYPTION_KEY:-}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-120/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: "${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY must be set in pi_dash.env; generate with openssl rand -hex 32}"
  # The api regenerates page/work-item documents through the live server
  # (POST {LIVE_BASE_URL}/live/convert-document/); without it every page
  # write fails with 503 "LIVE_URL is not configured".
  LIVE_BASE_URL: ${LIVE_BASE_URL:-http://live:3000}

x-rust-cutover-flags: &rust-cutover-flags
  # Rust-only edge interim (NEWPIDASH-381): explicit 1s plus a dead upstream.
  # Redundant under 381's defaults but harmless, so a rollback needs no
  # compose change. The upstream is the discard port on loopback: nothing
  # listens there, and it is never contacted while every flag below is 1.
  # (Copied from the root docker-compose.yml; keep the two in step.)
  PIDASH_RUST_WEB: "1"
  PIDASH_RUST_APP: "1"
  PIDASH_RUST_ASSISTANT: "1"
  PIDASH_RUST_LOOP: "1"
  PIDASH_RUST_PROMPTING: "1"
  PIDASH_RUST_SPACE: "1"
  PIDASH_RUST_LICENSE: "1"
  PIDASH_RUST_RUNNER_WEB: "1"
  PIDASH_RUST_API_V1: "1"
  PIDASH_RUST_RUNNER: "1"
  PIDASH_RUST_AUTH: "1"
  PIDASH_DJANGO_UPSTREAM: http://127.0.0.1:9

services:
  # (No web, space or admin: the old frontends are frozen and unserved.
  # web_new below is the only frontend.)
  web_new:
    image: airepublic/pi-dash-web-new:${APP_RELEASE:-stable}
    deploy:
      replicas: ${WEB_NEW_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker

  live:
    image: airepublic/pi-dash-live:${APP_RELEASE:-stable}
    environment:
      <<: [*live-env, *redis-env]
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api

  api:
    image: airepublic/pi-dash-api:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-api.sh
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env, *rust-cutover-flags]
      # `serve` is single-process async: no gunicorn, scale with replicas.
      # PORT 8000 is what the proxy dials (apps/proxy/Caddyfile.ce).
      PORT: "8000"
    depends_on:
      - pi-dash-db
      - pi-dash-redis

  worker:
    # The scheduler runs inside the worker; there is no beat service.
    image: airepublic/pi-dash-api:${APP_RELEASE:-stable}
    command: ./bin/docker-entrypoint-worker.sh
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env, *rust-cutover-flags]
    depends_on:
      - api
      - pi-dash-db
      - pi-dash-redis

  migrator:
    # Interim (NEWPIDASH-380): the exiting migrator runs Django
    # `manage.py migrate`. The backend image is no longer published
    # per-release (NEWPIDASH-382), so this pins the last Django build via
    # MIGRATOR_RELEASE (default `stable`); a custom local build sets it to
    # the local release in install.sh. TODO(NEWPIDASH-380): swap this for
    # the native `pidash-api migrate up` image and entrypoint.
    image: ${DOCKERHUB_USER:-airepublic}/pi-dash-backend:${MIGRATOR_RELEASE:-stable}
    command: ./bin/docker-entrypoint-migrator.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - pi-dash-db
      - pi-dash-redis

  # Comment this if you already have a database running
  pi-dash-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  pi-dash-redis:
    image: valkey/valkey:7.2.11-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - redisdata:/data

  # Comment this if you using any external s3 compatible storage
  pi-dash-minio:
    image: minio/minio:latest
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  # Comment this if you already have a reverse proxy running
  proxy:
    image: airepublic/pi-dash-proxy:${APP_RELEASE:-stable}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *proxy-env
    ports:
      - target: 80
        published: ${LISTEN_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${LISTEN_HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web_new
      - api
      - live

volumes:
  pgdata:
  redisdata:
  uploads:
  proxy_config:
  proxy_data:
