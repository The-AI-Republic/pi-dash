# Fixture for credential-preflight-e2e.sh: the community stack's bundled
# PostgreSQL and RabbitMQ images, plus an `api` stand-in with the app's
# client libraries (pinned from apps/api/requirements/base.txt). VOLUME_*
# are the values a volume is first created with; DATABASE_URL / AMQP_URL
# are what the app connects with, with the community compose defaults.
services:
  pi-dash-db:
    image: postgres:15.7-alpine
    environment:
      POSTGRES_USER: ${VOLUME_PG_USER:-pi-dash}
      POSTGRES_PASSWORD: ${VOLUME_PG_PASSWORD:-pi-dash}
      POSTGRES_DB: ${VOLUME_PG_DB:-pi-dash}

  pi-dash-mq:
    image: rabbitmq:3.13.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${VOLUME_MQ_USER:-pi-dash}
      RABBITMQ_DEFAULT_PASS: ${VOLUME_MQ_PASSWORD:-pi-dash}
      RABBITMQ_DEFAULT_VHOST: ${VOLUME_MQ_VHOST:-pi-dash}

  api:
    image: pi-dash-credential-preflight-api:test
    build:
      context: .
      args:
        PIP_PINS: ${PIP_PINS:-}
      dockerfile_inline: |
        FROM python:3.12.10-slim
        ARG PIP_PINS
        RUN pip install --no-cache-dir $PIP_PINS
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pi-dash:pi-dash@pi-dash-db/pi-dash}
      AMQP_URL: ${AMQP_URL:-amqp://pi-dash:pi-dash@pi-dash-mq:5672/pi-dash}
