# cargo-dist release config. Lives at the repo root so CI (which runs from
# /home/runner/work/pi-dash/pi-dash) can locate it. Run
# `cargo dist build --tag=v<version>` locally to exercise the matrix;
# GitHub Actions takes over for real releases.
[workspace]
members = ["cargo:runner"]

[dist]
cargo-dist-version = "0.22.1"
ci = "github"
installers = ["shell", "powershell", "msi"]
# cargo-dist 0.22.1 defaults to the retired ubuntu-20.04 runner image.
# The workflow is hand-patched to ubuntu-22.04; tell cargo-dist to stop
# policing it so `cargo dist plan` does not abort on the diff.
allow-dirty = ["ci"]
# The two `-musl` targets are not just for Alpine. cargo-dist stamps the build
# machine's glibc version into the generated installer as a hard floor, and the
# gnu builds run on ubuntu-22.04 (glibc 2.35) — so Ubuntu 20.04, Debian 11,
# RHEL 8 and Amazon Linux 2 all fail the check and get "no compatible downloads
# were found". With a musl archive published, the installer falls back to it
# instead of erroring. Viable because the runner is rustls-only (see reqwest's
# `default-features = false` + `rustls-tls` in runner/Cargo.toml) and so pulls
# in no OpenSSL to static-link.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
pr-run-mode = "plan"
install-path = "$HOME/.local/bin"

# `ring` (via rustls) compiles C for the musl targets and needs the musl
# toolchain on the builder. Harmless on the gnu runners.
[dist.dependencies.apt]
musl-tools = '*'

# Intel macOS uses GitHub's current x64 image. Windows builds run on the
# MSVC image so cargo-dist can produce archives, PowerShell, and MSI installers.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
aarch64-unknown-linux-musl = "ubuntu-22.04-arm"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2022"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-unknown-linux-musl = "ubuntu-22.04"
