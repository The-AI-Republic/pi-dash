[package]
name = "pidash-types"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
