[package]
name = "pidash-api"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
pidash-auth = { path = "../auth" }
pidash-services = { path = "../services" }
# Space public-API handlers (D-02): transactional `issue_activity`
# (+ `soft_delete_related_objects`) enqueue into `rust_job_queue`
# (the worker forwards Python-owned names to the broker); the crate is
# a path dependency, so the lockfile gains no new downloads from it.
# Space asset handlers also use it for the PATCH metadata task message
# builder plus the AMQP coexistence publisher. pidash-jobs depends only
# on types/db/services, so no cycle is introduced.
pidash-jobs = { path = "../jobs" }
# D-17 OAuth avatar persistence (PIDASHCONV-475): the shared server-side
# S3 PUT/DELETE/HEAD signers plus the avatar mapping live in the
# assets/storage-owned crate (PIDASHCONV-480) — this domain builds the
# SignedRequests here and executes them with reqwest, never a parallel
# signer. A path dependency, so the lockfile gains no new downloads.
pidash-storage = { path = "../storage" }
# Space intake `description_html` sanitization: `nh3` (the Python side) is
# bindings for this exact crate, so the same tags/attributes/schemes give
# the same bytes. Pinned to the 4.x line nh3 0.2.18 builds on.
ammonia = "4"
axum = "0.8"
bytes = "1"
flate2 = "1"
http = "1"
# The SSE live tail (PIDASHCONV-265) streams through `channel::Channel`;
# without the `channel` feature the module is compiled out and no other
# workspace crate enables it (no feature-unification rescue), so it is
# declared here explicitly.
http-body-util = { version = "0.1", features = ["channel"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: response envelopes and trimmed objects keep serializer field
# order, which byte-identical JSON parity with DRF requires. serde_json::Map
# is then insertion-ordered (IndexMap) instead of key-sorted (BTreeMap).
# arbitrary_precision: huge JSON integers (e.g. a 2**128 pk) keep their
# original text, so Python-int vs float discrimination and the exact decimal
# display DRF uses both survive parsing (`Number::to_string` echoes input).
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# DRF-compatible value rendering (F-07 serializer kernel): aware datetimes in
# any IANA zone (TimezoneMixin activates the user's zone per request) and
# Decimal-as-string (DRF COERCE_DECIMAL_TO_STRING).
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rust_decimal = { version = "1", features = ["serde"] }
sea-query = { version = "0.32", default-features = false, features = ["backend-postgres"] }
thiserror = "2"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4"] }
# Gitea OAuth handlers (D-17): workspace-members cache invalidation
# (`KEYS` + `DEL`). Same 1.x line and feature set the db crate builds on,
# so the lockfile gains no new downloads.
redis = { version = "1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
# License console handlers (D-01): session-auth-hash verification
# (`django.contrib.auth` `salted_hmac`) and the `email-credentials-check`
# SMTP conversation (implicit TLS + STARTTLS). All five were already in
# the lockfile via other crates; no new downloads.
hmac = "0.12.1"
sha2 = "0.10.9"
# `AUTH CRAM-MD5` challenge responses (`smtplib.auth_cram_md5`).
md-5 = "0.10.6"
# Assistant KMS JSON-API transport (D-06): base64 blobs for
# `CiphertextBlob`/`Plaintext`. Same 0.22 line the db crate builds on, so
# the lockfile gains no new downloads.
base64 = "0.22"
# Magic-link sign-in/up views read urlencoded forms via the D-16 email
# line below (`serde_urlencoded`; same 0.7 line, no new downloads).
# Assistant config validation (D-06): IDN second pass of the Django
# `URLValidator` port. Same 1.x line already in the lockfile, so no new
# downloads.
idna = "1"
# `ring`, not the default `aws-lc-rs`: ring is already vendored (reqwest),
# so no C-build chain enters the lockfile for the SMTP TLS paths.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# Device-session mint (`mt_` + `token_urlsafe(32)`, D-17 PIDASHCONV-343)
# plus Gitea OAuth draws (password salts, display-name and avatar-color,
# D-17 PIDASHCONV-341): same 0.9 line the auth and jobs crates build on,
# so the lockfile gains no new downloads.
rand = "0.9"
tokio-rustls = "0.26.5"
webpki-roots = "1.0.9"
tower = { version = "0.5" }
tracing = "0.1"
# GitHub App JWT (`build_app_jwt`, RS256): same 9.x line the auth and jobs
# crates build on, so the lockfile gains no new downloads.
jsonwebtoken = "9"
# Reverse proxy to Django. Default features are off on purpose: transparent
# decompression (gzip/br/zstd) would alter relayed bytes, and native-tls would
# add a system TLS dependency to CI. rustls with bundled roots covers https
# upstreams with pure Rust.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
zxcvbn = "3.1.1"
serde_urlencoded = "0.7.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
