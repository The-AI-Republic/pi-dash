[package]
name = "pidash-api"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
pidash-auth = { path = "../auth" }
pidash-services = { path = "../services" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Reverse proxy to Django. Default features are off on purpose: transparent
# decompression (gzip/br/zstd) would alter relayed bytes, and native-tls would
# add a system TLS dependency to CI. rustls with bundled roots covers https
# upstreams with pure Rust.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
