[package]
name = "pidash-services"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
pidash-auth = { path = "../auth" }
# D-05 GitHub adapter datetimes: same locked chrono 0.4.45 as pidash-db
# (no lock churn); std only, datetimes render to strings manually.
# D-09 workspace seed uses NaiveDate through the same std-only feature set.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
crc32fast = { version = "1" }
flate2 = { version = "1" }
# Version-task row builders carry typed UUIDs and timestamps (serde kept
# from the D-09 versions port; same locked chrono 0.4.45 as pidash-db).
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
