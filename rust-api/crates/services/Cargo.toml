[package]
name = "pidash-services"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
pidash-auth = { path = "../auth" }
# D-05 GitHub adapter datetimes: same locked chrono 0.4.45 as pidash-db
# (no lock churn). D-09 workspace seed uses NaiveDate through the same
# feature set; the D-09 versions port additionally needs serde for the
# typed row builders.
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
serde = { version = "1", features = ["derive"] }
# D-18 work-item shapes: to_representation builds wire-ordered maps, so Map
# must preserve insertion order (same locked serde_json 1.x + indexmap already
# in rust-api/Cargo.lock via pidash-types — no lock churn).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = { version = "2" }
crc32fast = { version = "1" }
flate2 = { version = "1" }
# Version-task row builders carry typed UUIDs and timestamps.
# D-08 activity trackers also use it for is_valid_uuid parity
# (pi_dash/utils/uuid.py); same locked uuid 1.x as pidash-db.
uuid = { version = "1", features = ["serde", "v4"] }
# D-08 page component extraction: BeautifulSoup html.parser equivalent for
# the mention-/image-component fragment selects in page_transaction_task.
scraper = { version = "0.24" }
# D-04 prompting renderer: sandboxed Jinja via minijinja with strict
# undefined (Porting guide); same locked minijinja 2.x as pidash-jobs
# (no lock churn).
minijinja = { version = "2" }
# D-19 collab serializers: Django EmailValidator port needs its user/domain/
# literal patterns (same locked regex 1.x as pidash-jobs, no lock churn);
# the IDN fallback needs UTS-46 ascii mapping (locked idna 1.x via url,
# no lock churn).
regex = "1"
idna = "1"
# D-30 page serializers: base64→bytes validation mirrors CPython
# base64.b64decode (same locked base64 0.22.x as pidash-api, no lock churn).
base64 = "0.22"
# D-16 password closure: zxcvbn scoring + token recipe primitives
# (same locked versions as pidash-api, no lock churn).
zxcvbn = "3"
rand = "0.9"
hmac = "0.13"
sha2 = "0.11"
# D-36 scheduler serializers: ZoneInfo-membership check for binding tzid
# validation (same locked chrono-tz 0.10.x as pidash-api, no lock churn).
chrono-tz = "0.10"
# D-37 ops commands (PIDASHCONV-806): wait-loop probes + migration-plan
# check run SQL directly (same locked sqlx 0.8.x as pidash-db — subset of
# its features, so no lock churn).
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }
# D-37 clear_cache: DEL + FLUSHDB against REDIS_URL (same locked redis 1.x
# and the same feature set as pidash-db, no lock churn).
redis = { version = "1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
# D-37 bucket commands: async S3 client (same locked reqwest 0.12.x as
# pidash-api, minus `stream` which the ops client does not need).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
# D-37 wait loops: sleep/timeout only (the runtime comes from the binary;
# macros/rt stay dev-only for the async unit tests below).
tokio = { version = "1", features = ["time"] }
# D-37 SigV4: reuse the shared hashing helper; the storage crate itself
# stays read-only (its fixed-shape sign_* helpers cannot sign the
# query-bearing list/policy requests, so ops signs those itself).
pidash-storage = { path = "../storage" }
# D-37 PutObject/PutBucketPolicy: botocore auto-sends Content-MD5 on these
# (same locked md-5 0.10.x already in the tree, no lock churn).
md-5 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# D-18 attachment overflow tests (PIDASHCONV-782): the request path
# publishes numbers through the api crate, which builds serde_json with
# arbitrary_precision — the overflow-literal pins need the same
# representation here. Test builds only; the shipped lib is unchanged
# (same locked serde_json 1.x, no lock churn).
serde_json = { version = "1", features = ["arbitrary_precision"] }
# D-04 seeding: sha256 assertions over the FIX-seed / FIX-scheduler golden
# bodies in this crate's own tests; same locked sha2 0.11.x as pidash-db
# (no lock churn).
sha2 = { version = "0.11" }
# D-33 tasks: HMAC-SHA256 replay of the FX-TSK-01 executed wire vector
# (test-only); same locked hmac 0.13.x + digest 0.11.x pair already in
# rust-api/Cargo.lock (no lock churn).
hmac = { version = "0.13" }
