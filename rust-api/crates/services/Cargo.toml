[package]
name = "pidash-services"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
pidash-auth = { path = "../auth" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
