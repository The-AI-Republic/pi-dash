[package]
name = "pidash-services"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
pidash-auth = { path = "../auth" }
chrono = { version = "0.4.45" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
# D-05 GitHub adapter datetimes: same locked chrono 0.4.45 as pidash-db
# (no lock churn); std only, datetimes render to strings manually.
chrono = { version = "0.4", default-features = false, features = ["std"] }
crc32fast = { version = "1" }
flate2 = { version = "1" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
