[package]
name = "pidash-services"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
pidash-auth = { path = "../auth" }
# D-05 GitHub adapter datetimes: same locked chrono 0.4.45 as pidash-db
# (no lock churn). D-09 workspace seed uses NaiveDate through the same
# feature set; the D-09 versions port additionally needs serde for the
# typed row builders.
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
crc32fast = { version = "1" }
flate2 = { version = "1" }
# Version-task row builders carry typed UUIDs and timestamps.
# D-08 activity trackers also use it for is_valid_uuid parity
# (pi_dash/utils/uuid.py); same locked uuid 1.x as pidash-db.
uuid = { version = "1", features = ["serde", "v4"] }
# D-08 page component extraction: BeautifulSoup html.parser equivalent for
# the mention-/image-component fragment selects in page_transaction_task.
scraper = { version = "0.24" }
# D-04 prompting renderer: sandboxed Jinja via minijinja with strict
# undefined (Porting guide); same locked minijinja 2.x as pidash-jobs
# (no lock churn).
minijinja = { version = "2" }
# D-19 collab serializers: Django EmailValidator port needs its user/domain/
# literal patterns (same locked regex 1.x as pidash-jobs, no lock churn);
# the IDN fallback needs UTS-46 ascii mapping (locked idna 1.x via url,
# no lock churn).
regex = "1"
idna = "1"
# D-30 page serializers: base64→bytes validation mirrors CPython
# base64.b64decode (same locked base64 0.22.x as pidash-api, no lock churn).
base64 = "0.22"
# D-16 password closure: zxcvbn scoring + token recipe primitives
# (same locked versions as pidash-api, no lock churn).
zxcvbn = "3"
rand = "0.9"
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# D-04 seeding: sha256 assertions over the FIX-seed / FIX-scheduler golden
# bodies in this crate's own tests; same locked sha2 0.11.x as pidash-db
# (no lock churn).
sha2 = { version = "0.11" }
# D-33 tasks: HMAC-SHA256 replay of the FX-TSK-01 executed wire vector
# (test-only); same locked hmac 0.13.x + digest 0.11.x pair already in
# rust-api/Cargo.lock (no lock churn).
hmac = { version = "0.13" }
