[package]
name = "pidash-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.11"
subtle = "2"
base64 = "0.22"
hex = "0.4"
pbkdf2 = "0.13"
jsonwebtoken = "9"
flate2 = "1"
rand = "0.9"
