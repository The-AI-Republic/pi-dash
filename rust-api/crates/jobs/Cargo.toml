[package]
name = "pidash-jobs"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "chrono"] }
amqprs = "2.1.5"

[dev-dependencies]
sqlparser = "0.63.0"
