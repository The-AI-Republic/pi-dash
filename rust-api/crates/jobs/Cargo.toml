[package]
name = "pidash-jobs"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
# Version-task flows call the D-09 decision layer (api-crate precedent).
pidash-services = { path = "../services" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
rrule = { version = "0.14", features = ["exrule", "by-easter"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "rt-multi-thread", "net", "io-util"] }
tracing = "0.1.44"
# D-07 tasks_mail (PIDASHCONV-216): template render (Django `{{ var }}`
# interpolation only) + plain-text regexes + the smtplib-faithful SMTP
# conversation (implicit TLS + STARTTLS). minijinja is the one new download;
# every other pin below was already in the lockfile via pidash-api/db.
minijinja = "2"
regex = "1"
base64 = "0.22"
hmac = "0.12.1"
md-5 = "0.10.6"
# `ring`, not the default `aws-lc-rs`: ring is already vendored (reqwest),
# so no C-build chain enters the lockfile for the SMTP TLS paths.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26.5"
webpki-roots = "1.0.9"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
amqprs = "2.1.5"
# D-08 sinks: PostHog `/batch/` POST (same TLS stack as pidash-api: rustls
# with bundled roots, no system TLS dependency in CI) + BSON document
# build for the mongo log path (shares the locked bson via mongodb);
# D-08 link crawler live HTTPS adapter adds `blocking` (redirects off; the
# pure redirect loop in pidash-services owns hop validation).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
bson = "2"
sea-query = { version = "0.32", default-features = false, features = ["backend-postgres", "with-uuid"] }
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
sqlparser = "0.63.0"
