[package]
name = "pidash-jobs"
version = "0.1.0"
edition = "2021"

[dependencies]
pidash-types = { path = "../types" }
pidash-db = { path = "../db" }
# Version-task flows call the D-09 decision layer (api-crate precedent).
pidash-services = { path = "../services" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
rrule = { version = "0.14", features = ["exrule", "by-easter"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
amqprs = "2.1.5"
sea-query = { version = "0.32", default-features = false, features = ["backend-postgres", "with-uuid"] }
sha2 = "0.10"

[dev-dependencies]
sqlparser = "0.63.0"
