[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = .
norecursedirs = .venv __pycache__ .git
pythonpath = .
markers =
    contract: black-box HTTP contract assertions shared by both backends.
# Contract suites drive a live backend over HTTP and seed Postgres directly:
# never load pytest-django (nor Django's test client), even when
# DJANGO_SETTINGS_MODULE leaks in from the environment.
addopts = -p no:cacheprovider -p no:django
