[package]
name = "pidash-api-bin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pidash-api"
path = "src/main.rs"

[dependencies]
pidash-types = { path = "../../crates/types" }
pidash-db = { path = "../../crates/db" }
pidash-auth = { path = "../../crates/auth" }
pidash-services = { path = "../../crates/services" }
pidash-api = { path = "../../crates/api" }
pidash-jobs = { path = "../../crates/jobs" }
axum = "0.8"
# D-37 ops (PIDASHCONV-807/808/809, one line):
# batch `now` + fresh row ids (807/808) and Utc timestamps for
# register/dry-run (809). Same locked chrono 0.4.x as pidash-db, so
# no lock churn; features are the union the groups need.
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive"] }
# D-08 issue_activity worker wiring (PIDASHCONV-836): the jobs crate's
# `RedisOrigin` seam is sync while the foundation handle is async-only, so
# the binary owns a thin blocking adapter over the same locked redis 1.7.1
# pidash-db uses (no lock churn; `tls-rustls-webpki-roots` because
# production `REDIS_URL` values are `rediss://`, same as pidash-db).
redis = { version = "1", default-features = false, features = ["tls-rustls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# D-37 ops row ids (PIDASHCONV-807/808/810):
# same locked uuid 1.x as pidash-db/pidash-services (no lock churn);
# features are the union of the groups' needs.
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
